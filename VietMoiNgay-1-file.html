const AI_PROV={gemini:{name:'Google Gemini',model:'gemini-3.8-flash',note:'Có gói miễn phí (giới hạn số lượt mỗi phút/ngày). Lấy key tại aistudio.google.com → Get API key.'},

  openai:{name:'OpenAI / dịch vụ tương thích OpenAI',model:'',base:'https://api.openai.com/v1',note:'Dùng cho OpenAI, OpenRouter, DeepSeek… và các dịch vụ có API chuẩn OpenAI: nhập Base URL và tên model đúng như trang của dịch vụ đó. Một số dịch vụ có thể không cho gọi trực tiếp từ trình duyệt.'}};

async function apiCall(input,{json=false}={}){const c=CFG.ai||{};if(!c.key)throw {code:'no_ai'};
  const msgs=typeof input==='string'?[{role:'user',content:input}]:input;let r,d;
  try{if(c.prov==='openai'){if(!c.model)throw {code:'bad_key',message:'Chưa nhập tên model.'};r=await fetch((c.base||AI_PROV.openai.base).replace(/\/+$/,'')+'/chat/completions',{method:'POST',headers:{'content-type':'application/json',Authorization:'Bearer '+c.key},body:JSON.stringify({model:c.model,messages:msgs})});
      d=await r.json().catch(()=>({}));if(!r.ok)throw {code:r.status===429?'rate_limited':r.status===401||r.status===403||r.status===404?'bad_key':'api',message:d?.error?.message};return d.choices?.[0]?.message?.content||''}
    if(c.prov==='anthropic'){r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:c.model||AI_PROV.anthropic.model,max_tokens:4096,messages:msgs})});
      d=await r.json();if(!r.ok)throw {code:r.status===429?'rate_limited':r.status===401||r.status===403?'bad_key':'api',message:d?.error?.message};return d.content.filter(x=>x.type==='text').map(x=>x.text).join('')}
    r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(c.model||AI_PROV.gemini.model)+':generateContent',{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':c.key},
      body:JSON.stringify({contents:msgs.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]})),generationConfig:json?{responseMimeType:'application/json'}:{}})});
    d=await r.json();if(!r.ok)throw {code:r.status===429?'rate_limited':r.status===400&&/API key/i.test(d?.error?.message||'')||r.status===403?'bad_key':'api',message:d?.error?.message};
    return (d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('')}
  catch(e){if(e&&e.code)throw e;throw {code:'offline',message:String(e)}}}
async function chat(conv,onText){const s=await getSample();if(s){const r=await s(conv,{cache:false,modelTier:'quick',onText});return r.text}const t=await apiCall(conv);onText&&onText({text:t});return t}

async function bundle(){const w={};for(const h of S.hist){const x=await getWriting(h.id);if(x)w[h.id]=x}const ac=CFG.ai;return {app:'viet-moi-ngay',ver:2,exported:new Date().toISOString(),state:JSON.parse(JSON.stringify(S)),writings:w,...(ac?.sync&&ac.key?{aicfg:{prov:ac.prov,model:ac.model,key:ac.key,base:ac.base||''}}:{})}}
function aggTime(st){const t={total:0,k:{learn:0,drill:0,write:0,flow:0,out:0},d:{}};for(const b of Object.values(st.tdev||{})){t.total+=b.t||0;for(const [k,v] of Object.entries(b.k||{}))t.k[k]=(t.k[k]||0)+v;for(const [k,v] of Object.entries(b.d||{}))t.d[k]=(t.d[k]||0)+v}return t}
function streakOf(days){const set=new Set(days);let d=new Date(),n=0;if(!set.has(todayStr(d)))d.setDate(d.getDate()-1);while(set.has(todayStr(d))){n++;d.setDate(d.getDate()-1)}return n}
function mergeState(A,B){A=Object.assign(fresh(),A);B=Object.assign(fresh(),B);const nw=(A.updated||0)>=(B.updated||0)?A:B,M=Object.assign(fresh(),JSON.parse(JSON.stringify(nw)));
  const mx=(a,b)=>{const o={...a};for(const [k,v] of Object.entries(b||{}))o[k]=Math.max(o[k]??-Infinity,v);return o};
  M.xpd=mx(A.xpd,B.xpd);M.xp=Object.values(M.xpd).reduce((s,v)=>s+v,0);
  M.tdev={};for(const dv of new Set([...Object.keys(A.tdev||{}),...Object.keys(B.tdev||{})])){const a=A.tdev?.[dv]||{},b=B.tdev?.[dv]||{};M.tdev[dv]={t:Math.max(a.t||0,b.t||0),k:mx(a.k,b.k),d:mx(a.d,b.d)}}M.time=aggTime(M);
  M.days=[...new Set([...A.days,...B.days])].sort().slice(-400);M.lastDay=M.days[M.days.length-1]||'';M.streak=streakOf(M.days);M.best=Math.max(A.best,B.best,M.streak);
  M.done={};for(const k of new Set([...Object.keys(A.done),...Object.keys(B.done)])){const a=A.done[k],b=B.done[k];M.done[k]=!a?b:!b?a:{best:Math.max(a.best??0,b.best??0),n:Math.max(a.n||0,b.n||0),...(a.skip&&b.skip?{skip:1}:{})}}
  M.lp=mx(A.lp,B.lp);M.wrote=mx(A.wrote,B.wrote);M.vr=mx(A.vr,B.vr);M.drillOk=Math.max(A.drillOk,B.drillOk);M.revs=Math.max(A.revs,B.revs);M.qc=[A.qc,B.qc].sort().pop()||'';
  M.boss={};for(const k of new Set([...Object.keys(A.boss),...Object.keys(B.boss)]))M.boss[k]={best:Math.max(A.boss[k]?.best??0,B.boss[k]?.best??0)};
  M.badges=[...new Set([...A.badges,...B.badges])];
  M.tomb={v:[...new Set([...(A.tomb?.v||[]),...(B.tomb?.v||[])])].slice(-500),e:[...new Set([...(A.tomb?.e||[]),...(B.tomb?.e||[])])].slice(-500)};
  const ek=e=>e.o+'|'+e.c+'|'+e.at,em=new Map();for(const e of [...A.errors,...B.errors])em.set(ek(e),e);M.errors=[...em.values()].filter(e=>!M.tomb.e.includes(ek(e))).sort((x,y)=>String(x.at).localeCompare(String(y.at))).slice(-300);
  const vm=new Map();for(const v of [...A.vocab,...B.vocab]){const o=vm.get(v.w);if(!o||(v.t||0)>(o.t||0)||((v.t||0)===(o.t||0)&&(v.box||0)>(o.box||0)))vm.set(v.w,v)}M.vocab=[...vm.values()].filter(v=>!M.tomb.v.includes(v.w));
  const hm=new Map();for(const h of [...A.hist,...B.hist])hm.set(h.id,h);M.hist=[...hm.values()].sort((x,y)=>x.date.localeCompare(y.date)).slice(-500);
  const lm=new Map();for(const l of [...(A.log||[]),...(B.log||[])])lm.set(l.id,l);M.log=[...lm.values()].sort((x,y)=>x.at.localeCompare(y.at)).slice(-1500);
  M.dstat={};for(const k of new Set([...Object.keys(A.dstat||{}),...Object.keys(B.dstat||{})])){const a=A.dstat?.[k]||{},b=B.dstat?.[k]||{};M.dstat[k]=(a.n||0)>=(b.n||0)?a:b}M.mi=Math.max(A.mi??-1,B.mi??-1);
  M.updated=Math.max(A.updated||0,B.updated||0);return M}
function mergeBundle(a,b){return {app:'viet-moi-ngay',ver:2,exported:new Date().toISOString(),state:mergeState(a.state||{},b.state||{}),writings:Object.assign({},b.writings||{},a.writings||{})}}
async function applyBundle(b,replace){S=replace?Object.assign(fresh(),b.state):mergeState(S,b.state);migrate();for(const [id,w] of Object.entries(b.writings||{}))await saveWriting(id,w);saveLocal();push();header()}

/* -- đồng bộ qua GitHub Gist (riêng tư) -- */
let gSync=false,gT=0;const GF='viet-moi-ngay.json';
function gistLater(){if(CFG.gist?.token){clearTimeout(gT);gT=setTimeout(()=>gistSync(false),20000)}}
async function gistSync(manual){const g=CFG.gist;if(!g?.token||gSync)return;gSync=true;setSyncLabel('Đang đồng bộ…');
  const H={Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json'};
  try{let remote=null;if(g.id){const r=await fetch('https://api.github.com/gists/'+g.id,{headers:H,cache:'no-store'});
      if(r.status===404)g.id='';else if(!r.ok)throw {code:r.status===401?'bad_token':'api'};else{const j=await r.json(),f=j.files?.[GF];if(f){const t=f.truncated?await (await fetch(f.raw_url,{cache:'no-store'})).text():f.content;remote=JSON.parse(t)}}}
    else{const r=await fetch('https://api.github.com/gists?per_page=100',{headers:H,cache:'no-store'});if(r.status===401)throw {code:'bad_token'};if(r.ok){const l=await r.json(),hit=l.find(x=>x.files&&x.files[GF]);if(hit){g.id=hit.id;gSync=false;cfgSet(CFG);return gistSync(manual)}}}
    if(remote?.aicfg&&!CFG.ai?.key){CFG.ai={...remote.aicfg,sync:true};cfgSet(CFG);toast('Đã nhận cài đặt AI từ thiết bị khác.')}
    const local=await bundle(),merged=remote?mergeBundle(local,remote):local;if(CFG.ai?.key)CFG.ai.sync?merged.aicfg=local.aicfg:delete merged.aicfg;else if(remote?.aicfg)merged.aicfg=remote.aicfg;
    if(remote){await applyBundle(merged,true)}
    const body=JSON.stringify({description:'Viết Mỗi Ngày — dữ liệu đồng bộ (riêng tư)',files:{[GF]:{content:JSON.stringify(merged)}},...(g.id?{}:{public:false})});
    const w=await fetch('https://api.github.com/gists'+(g.id?'/'+g.id:''),{method:g.id?'PATCH':'POST',headers:{...H,'content-type':'application/json'},body});if(!w.ok)throw {code:w.status===401?'bad_token':'api'};
    const wj=await w.json();g.id=wj.id;g.last=Date.now();cfgSet(CFG);setSyncLabel('Đã đồng bộ lúc '+new Date().toLocaleTimeString('vi-VN'));if(manual)toast('Đồng bộ xong.');if(remote)route();
  }catch(e){setSyncLabel(e.code==='bad_token'?'Token không hợp lệ hoặc thiếu quyền Gist.':'Chưa đồng bộ được (mất mạng?). Sẽ thử lại.');if(manual)toast('Đồng bộ chưa thành công.')}
  gSync=false}
function setSyncLabel(t){CFG.gist&&(CFG.gist.msg=t);const el=$('#gmsg');if(el)el.textContent=t}
addEventListener('visibilitychange',()=>{if(!CFG.gist?.token)return;if(document.visibilityState==='visible')gistSync(false);else{clearTimeout(gT);gistSync(false)}});

  const imp=async txt=>{try{const b=JSON.parse(txt);if(!b.state)throw 0;if(b.aicfg&&!CFG.ai?.key&&!IN_CLAUDE){CFG.ai={...b.aicfg,sync:true};cfgSet(CFG)}await applyBundle(b,false);toast('Đã nhập và gộp dữ liệu.');redraw()}catch(e){toast('File không đúng định dạng sao lưu của app.')}};

  $('#imP').onclick=()=>{$('#imZ').innerHTML='<textarea id="imT" rows="5" class="small" placeholder="Dán dữ liệu đã xuất vào đây"></textarea><div class="row sp"><button class="btn pri" id="imGo">Nhập</button></div>';$('#imGo').onclick=()=>imp($('#imT').value)};
  if(IN_CLAUDE)return;
  $('#gSave').onclick=()=>{const t=$('#gtk').value.trim();if(!t){toast('Dán token trước.');return}CFG.gist={...(CFG.gist||{}),token:t};cfgSet(CFG);gistSync(true).then(redraw)};
  $('#gNow')&&($('#gNow').onclick=()=>gistSync(true));$('#gOff')&&($('#gOff').onclick=()=>{delete CFG.gist;cfgSet(CFG);redraw()});

function parseJSON(t){t=String(t||'').replace(/```json|```/g,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw {code:'parse',message:'AI trả lời không đúng định dạng'};return JSON.parse(t.slice(a,b+1))}
async function ai(prompt,{tier='default',json=true}={}){const s=await getSample();if(!s){const t=await apiCall(prompt,{json});return json?parseJSON(t):t}

  const r=await s(prompt,{modelTier:tier});return parseJSON(r.text)}
function aiErr(e){const c=e&&e.code;if(c==='no_ai')return IN_CLAUDE?'Hãy cho phép app "hỏi Claude" để dùng AI.':'Chưa cài AI chấm bài: vào Sổ tay → Cài đặt → mục 3 để nhập API key (Gemini có gói miễn phí).';if(c==='not_granted')return 'AI chỉ hoạt động khi mở app trên claude.ai và cho phép "hỏi Claude".';if(c==='bad_key')return 'API key không hợp lệ hoặc model không tồn tại. Kiểm tra lại trong Cài đặt.';if(c==='offline')return 'Không kết nối được AI — kiểm tra mạng.';if(c==='rate_limited')return 'AI đang bận, thử lại sau ít phút nhé.';return 'Không nhận được phản hồi từ AI. Thử lại nhé.'}

/* ============ mind map (SVG at real pixel size) ============ */
function mindmap(el,data){if(!el||!data)return;el.classList.add('mm');
  const draw=()=>{if(!el.isConnected){ro.disconnect();return}const W=Math.max(280,el.clientWidth);const B=(data.b||[]).slice(0,7);
    const cut=(s,n)=>{s=String(s);return s.length>n?s.slice(0,n-1)+'…':s};let o='';
    const box=(x,y,w,h,col,txt,add,fs=14)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" style="fill:${add?'var(--paper)':col};stroke:${col};stroke-width:2;${add?'stroke-dasharray:5 4':''}"/><text x="${x+12}" y="${y+h/2+5}" font-size="${fs}" font-weight="700" style="fill:${add?col:'#fff'}">${esc(txt)}</text>`;
    if(W>=620){const cw=Math.min(210,W*.24),colW=(W-cw-90)/2,R=[],L=[];B.forEach((b,i)=>(i%2?L:R).push([b,i]));
      const bh=b=>36+Math.min(b.k?.length||0,5)*24+14,sh=a=>a.reduce((s,[b])=>s+bh(b)+12,0);const H=Math.max(sh(R),sh(L),150)+10,cy=H/2,cx=W/2;
      const lines=[];const cc=Math.floor(cw/8.6);let words_=String(data.c).split(' '),cur='';for(const w of words_){if((cur+' '+w).trim().length>cc){lines.push(cur.trim());cur=w}else cur+=' '+w}lines.push(cur.trim());const ls=lines.slice(0,3),chh=26+ls.length*20;
      const side=(arr,dir)=>{let y=(H-sh(arr))/2;for(const [b,i] of arr){const col=COLORS[i%COLORS.length],x=dir>0?cx+cw/2+44:8,h=bh(b);const mc=Math.floor((colW-24)/7.6);
          const hx=dir>0?x:x+colW,sx=cx+dir*cw/2;o+=`<path d="M${sx} ${cy} C${sx+dir*30} ${cy},${hx-dir*30} ${y+18},${hx} ${y+18}" style="fill:none;stroke:${col};stroke-width:2.5"/>`;
          o+=box(x,y,colW,36,col,(b.add?'+ ':'')+cut(b.l,mc),b.add);
          (b.k||[]).slice(0,5).forEach((k,j)=>{const ky=y+36+16+j*24;o+=`<circle cx="${x+14}" cy="${ky-5}" r="3.5" style="fill:${col}"/><text x="${x+26}" y="${ky}" font-size="14" style="fill:var(--ink)">${esc(cut(k,mc-2))}</text>`});y+=h+12}};
      side(R,1);side(L,-1);
      o+=`<rect x="${cx-cw/2}" y="${cy-chh/2}" width="${cw}" height="${chh}" rx="16" style="fill:var(--ink)"/>`+ls.map((l,i)=>`<text x="${cx}" y="${cy-chh/2+30+i*20}" text-anchor="middle" font-size="16" font-weight="800" style="fill:var(--paper)">${esc(l)}</text>`).join('');
      el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mind map: ${esc(data.c)}">${o}</svg>`;
    }else{let y=8;const mc=Math.floor((W-60)/7.8);o+=`<rect x="0" y="${y}" width="${W}" height="44" rx="14" style="fill:var(--ink)"/><text x="16" y="${y+28}" font-size="16" font-weight="800" style="fill:var(--paper)">${esc(cut(data.c,mc))}</text>`;y+=56;
      const top=y-12;B.forEach((b,i)=>{const col=COLORS[i%COLORS.length];o+=`<path d="M14 ${top} V${y+17} H30" style="fill:none;stroke:${col};stroke-width:2.5"/>`+box(30,y,W-30,34,col,(b.add?'+ ':'')+cut(b.l,mc-2),b.add);y+=34;
        (b.k||[]).slice(0,5).forEach(k=>{y+=24;o+=`<circle cx="44" cy="${y-5}" r="3.5" style="fill:${col}"/><text x="56" y="${y}" font-size="14" style="fill:var(--ink)">${esc(cut(k,mc-4))}</text>`});y+=18});
      el.innerHTML=`<svg width="${W}" height="${y}" viewBox="0 0 ${W} ${y}" role="img" aria-label="Mind map">${o}</svg>`}};
  const ro=new ResizeObserver(draw);ro.observe(el);draw()}

function annotate(t){const labs={};const h=esc(t).replace(/\{\{(.+?)::([\s\S]+?)\}\}/g,(m,l,x)=>{if(!(l in labs))labs[l]=COLORS[Object.keys(labs).length%COLORS.length];return `<span class="ann" style="--c:${labs[l]}" title="${l}"><span class="tag">${l}</span>${x}</span>`}).replace(/\n/g,'<br>');

function drillSession(el,items,{title='',onDone,again,unit}={}){let i=0;const res=[];KIND='drill';
  const render=()=>{if(i>=items.length)return finish();const {t,d}=items[i];let body='';const st={pick:[]};
    const prog='<div class="prog">'+items.map((_,j)=>`<i class="${j<i?(res[j]?'ok':'no'):j===i?'on':''}"></i>`).join('')+'</div>';
    if(t==='scramble'){d._s=d._s||shuffle(d.w).map((w,k)=>({w,k}));body=`<div class="slot" id="slot" aria-label="Câu của bạn"></div><div class="tiles" id="tiles">${d._s.map(x=>`<button class="tile" data-k="${x.k}">${esc(x.w)}</button>`).join('')}</div>`}
    else if(t==='fix')body=`<div class="wrongs">${esc(d.w)}</div><textarea id="ans" rows="2" class="sp en" placeholder="Viết lại câu đúng…"></textarea>`;
    else if(t==='combine')body=`<p class="en" style="font-size:18px">${esc(d.a)}<br>${esc(d.b)}</p><p>Dùng: <span class="chip b">${esc(d.h)}</span></p><textarea id="ans" rows="2" class="en" placeholder="Câu ghép của bạn…"></textarea>`;
    else if(t==='trans')body=`<p style="font-size:19px;font-weight:600">${esc(d.vi)}</p><textarea id="ans" rows="2" class="en" placeholder="Viết bằng tiếng Anh…"></textarea>`;
    else if(t==='pick')body=`<p class="dq">${esc(d.q)}</p>${d.o.map((o,k)=>`<button class="opt" data-o="${k}">${esc(o)}</button>`).join('')}`;
    else if(t==='order'){d._s=d._s||shuffle(d.s.map((s,k)=>({s,k})));body=`<p class="dq">${esc(d.q||'')}</p><div id="olist">${d._s.map(x=>`<button class="opt en" data-k="${x.k}">${esc(x.s)}</button>`).join('')}</div><ol id="oans" class="en"></ol>`}
    el.innerHTML=`<div class="drill card">${prog}<div class="row" style="justify-content:space-between"><b>${DT[t][0]}</b><span class="mut small">${i+1}/${items.length}${title?' · '+esc(title):''}</span></div><p class="mut small">${DT[t][1]}</p>${body}<div class="row sp" id="act">${t==='pick'?'':'<button class="btn pri" id="chk">Kiểm tra</button>'}${['fix','combine','trans'].includes(t)?'<button class="btn ghost" id="skip">Xem đáp án</button>':''}</div><div id="fbk"></div></div>`;
    const ans=$('#ans',el);if(ans)ans.focus();
    if(t==='scramble'){const pick=[];const slot=$('#slot',el);$$('#tiles .tile',el).forEach(b=>b.onclick=()=>{pick.push(+b.dataset.k);b.style.visibility='hidden';drawS()});
      const drawS=()=>{slot.innerHTML=pick.map((k,j)=>`<button class="tile" data-j="${j}">${esc(d.w[k])}</button>`).join('');$$('.tile',slot).forEach(b=>b.onclick=()=>{const k=pick.splice(+b.dataset.j,1)[0];$(`#tiles [data-k="${k}"]`,el).style.visibility='visible';drawS()})};
      $('#chk',el).onclick=()=>{const u=pick.map(k=>d.w[k]).join(' ');grade(norm(u)===norm(d.a),'Đáp án: <span class="en">'+esc(d.a)+'.</span>')}}
    if(t==='pick')$$('.opt',el).forEach(b=>b.onclick=()=>{const k=+b.dataset.o;$$('.opt',el).forEach(x=>x.disabled=true);$$('.opt',el)[d.a].classList.add('ok');if(k!==d.a)b.classList.add('no');grade(k===d.a,esc(d.y||''))});
    if(t==='order'){const seq=[];$$('#olist .opt',el).forEach(b=>b.onclick=()=>{seq.push(+b.dataset.k);b.style.display='none';$('#oans',el).innerHTML=seq.map(k=>`<li>${esc(d.s[k])}</li>`).join('')});
      $('#chk',el).onclick=()=>grade(seq.join()===d.a.join(),'Thứ tự đúng: '+d.a.map(k=>`<div class="en">• ${esc(d.s[k])}</div>`).join(''))}

  };

    $('#again',el).onclick=()=>again?again():(items.forEach(x=>{delete x.d._s}),i=0,res.length=0,render());if(onDone)$('#dn',el).onclick=()=>onDone(ok)};
  render()}

async function aiDrills(type,topic){const sch={scramble:'{"a":"a correct sentence of 5-9 words without final punctuation"}',fix:'{"w":"a sentence with ONE error typical of Vietnamese learners","r":["corrected sentence"],"y":"giải thích ngắn bằng tiếng Việt"}',combine:'{"a":"short sentence","b":"short sentence","h":"connector to use","r":["combined sentence","alternative"]}',trans:'{"vi":"câu tiếng Việt tự nhiên","en":["English translation","alternative"]}',pick:'{"q":"câu hỏi (có thể bằng tiếng Việt)","o":["option","option","option","option"],"a":0,"y":"giải thích tiếng Việt"}'};
  const r=await ai(`${who()} Create 6 new English WRITING practice items of type "${type}" about the topic "${topic||'everyday life'}", matched to the learner's level, focusing on sentence building and errors Vietnamese learners commonly make (missing "be", tense, articles, plurals, word order, although/but, because/so). Return ONLY JSON {"items":[${sch[type]}, ...]}`);
  return (r.items||[]).map(d=>{if(type==='scramble'){d.a=String(d.a).replace(/[.!?]$/,'');d.w=d.a.split(' ')}if(type==='pick')d.a=+d.a||0;return {t:type,d}}).filter(x=>type!=='scramble'||x.d.w.length>2)}

function tutor(el,ctxTitle){const msgs=[];el.innerHTML=`<p class="small mut">Hỏi bất cứ điều gì: ngữ pháp, cách diễn đạt, "câu này viết vậy được không?"…</p><div class="chat" id="chat"></div><div class="row"><input type="text" id="tq" placeholder="Ví dụ: khi nào dùng which, khi nào dùng that?" style="flex:1"><button class="btn pri" id="ts">Hỏi</button></div>`;
  const cbox=$('#chat',el),inp=$('#tq',el);
  const send=async()=>{const q=inp.value.trim();if(!q)return;inp.value='';msgs.push({role:'user',content:q});cbox.insertAdjacentHTML('beforeend',`<div class="msg me">${esc(q)}</div>`);const box=document.createElement('div');box.className='msg';box.textContent='…';cbox.append(box);cbox.scrollTop=cbox.scrollHeight;
    try{const conv=msgs.map((m,j)=>j===0?{role:'user',content:`Bạn là gia sư viết tiếng Anh thân thiện cho người Việt. ${who()} Bài đang học: "${ctxTitle}". Trả lời bằng tiếng Việt, ngắn gọn (tối đa ~150 từ), có 1–2 ví dụ tiếng Anh. Nếu người học gửi câu tiếng Anh, hãy sửa và giải thích lỗi.\n\nCâu hỏi: ${m.content}`}:m);
      const rt=await chat(conv,({text})=>{box.textContent=text;cbox.scrollTop=cbox.scrollHeight});box.textContent=rt;msgs.push({role:'assistant',content:rt})}catch(e){box.textContent=aiErr(e);msgs.pop()}};
  $('#ts',el).onclick=send;inp.onkeydown=e=>{if(e.key==='Enter')send()}}

/* ---------- topic bank helpers ---------- */
const LVC=['A1','A2','B1','B2+'],LVMIN=[70,100,150,250];
const GEN_CHECK=['Câu nào cũng có chủ ngữ + động từ','Câu đầu nêu ý chính','Có ví dụ hoặc chi tiết cụ thể','Soát thì, số nhiều, mạo từ a/an/the'];
const PROMPT_N=THEMES.reduce((s,t)=>s+t.p.length,0);
const COMBO_N=THEMES.reduce((s,t)=>s+t.p.reduce((a,p)=>a+TWISTS.filter(w=>w[0]<=p[0]).length,0),0);
const lvRange=()=>{const l=S.profile?.level??1;return [l,Math.min(3,l+1)]};
function refFor(th,r){const T=THEMES[th],[a,b]=lvRange();let idx=T.p.map((_,i)=>i).filter(i=>T.p[i][0]>=a&&T.p[i][0]<=b);if(!idx.length)idx=T.p.map((_,i)=>i);
  const i=idx[r%idx.length],tws=TWISTS.map((_,j)=>j).filter(j=>TWISTS[j][0]<=T.p[i][0]);return {th,i,tw:tws[Math.floor(r/7)%tws.length]}}
function todayTopic(){const d=todayStr();if(S.daily&&S.daily.date===d&&(S.daily.ref||S.daily.ai))return S.daily;
  const day=Math.floor(new Date(d+'T12:00:00').getTime()/864e5);S.daily={date:d,ref:refFor(day%THEMES.length,hash(d))};saveLocal();return S.daily}
function refCtx(ref,kind='topic'){const T=THEMES[ref.th],p=T.p[ref.i],g=p[1],isI=g==='i',tw=ref.tw!=null?TWISTS[ref.tw][1]:null;
  return {key:(kind==='daily'?'daily-'+todayStr()+'-':'t-')+T.id+'-'+ref.i,kind,title:T.vi+' · '+GENRES[g],prompt:p[2],vi:p[3],min:LVMIN[p[0]],max:LVMIN[p[0]]+(isI?70:80),ielts:isI,timer:isI?40:0,
    vocab:T.v.map(v=>[v[0],v[1]]),twist:tw,theme:T.id,pk:T.id+'-'+ref.i,type:GENRES[g],frames:isI?UNIT('u16').frames:nextUnit().frames,
    check:(isI?UNIT('u16').task.check:GEN_CHECK).concat(tw?['Luật thử thách: '+tw]:[])}}
function dailyCtxFrom(dt){if(dt.ref)return refCtx(dt.ref,'daily');const a=dt.ai,lv=S.profile?.level??1;
  return {key:'daily-ai-'+hash(a.p),kind:'daily',title:a.t,prompt:a.p,vi:a.vi,min:LVMIN[lv],max:LVMIN[lv]+80,vocab:a.vocab||[],mind:a.mind,frames:nextUnit().frames,check:GEN_CHECK}}
const dueCards=()=>{const n=Date.now();return S.vocab.filter(v=>!v.due||v.due<=n)};
const fmtH=s=>{const h=s/3600;return h<100?h.toFixed(1).replace('.',','):Math.floor(h).toLocaleString('vi-VN')};

  view.innerHTML=`<section class="page"><span class="chip b">Bạn đang ở đây</span><h1 style="font-family:Literata,serif;font-weight:600;margin:.3em 0 .1em">Chặng ${cs+1} · ${esc(STAGES[cs].name)}</h1>
     <p style="line-height:32px;margin:0">Bài tiếp theo: <b>${esc(cur.title)}</b> (bài ${UNITS.indexOf(cur)+1}/18)</p>
     <div class="row" style="line-height:32px"><div class="bar" style="flex:1"><b style="width:${real/18*100}%"></b></div><b>${real}/18 bài</b></div>

function lineChart(el,pts,max,unit){if(!el)return;const draw=()=>{if(!el.isConnected){ro.disconnect();return}const W=Math.max(260,el.clientWidth),H=200,L=34,R=12,Tp=14,B=28;
    if(!pts.length){el.innerHTML='<p class="small mut">Chưa có dữ liệu.</p>';return}const n=pts.length,x=i=>L+(n===1?(W-L-R)/2:i*(W-L-R)/(n-1)),y=v=>Tp+(1-v/max)*(H-Tp-B);
    let o='';for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);o+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" style="stroke:var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="11" style="fill:var(--mut)">${+v.toFixed(1)}</text>`}
    o+=`<polyline points="${pts.map((p,i)=>x(i)+','+y(p.v)).join(' ')}" style="fill:none;stroke:var(--red);stroke-width:2.5"/>`;
    o+=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4.5" style="fill:var(--paper);stroke:var(--red);stroke-width:2.5"><title>${esc(p.l)}: ${p.v}${unit}</title></circle>`).join('');
    const step=Math.ceil(n/(W<520?4:8));pts.forEach((p,i)=>{if(i%step===0||i===n-1)o+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" style="fill:var(--mut)">${esc(p.d)}</text>`});
    el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ điểm">${o}</svg>`};const ro=new ResizeObserver(draw);ro.observe(el);draw()}

      const T=LOGT[l.t]||['Hoạt động','#888'],tm=new Date(l.at).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
      const act=(l.t==='write'||l.t==='boss')&&l.hid?`<button class="btn ghost" data-redo="${esc(l.hid)}">Làm lại</button><button class="btn ghost" data-view="${esc(l.hid)}">Xem bài</button>`:(l.t==='step'||l.t==='lesson')&&l.ref?.unit?`<a class="btn ghost" href="#lesson-${l.ref.unit}">Học lại</a>`:l.t==='drill'?`<button class="btn ghost" data-dr="${esc(l.id)}">Luyện lại</button>`:l.t==='review'?'<a class="btn ghost" href="#review">Ôn thẻ</a>':l.t==='theme'&&l.ref?.theme?`<a class="btn ghost" href="#topic-${l.ref.theme}">Mở chủ đề</a>`:l.t==='stage'?'<a class="btn ghost" href="#map">Xem lộ trình</a>':'';
      o+=`<div class="lentry"><i style="background:${T[1]}"></i><div><div class="small mut">${tm} · ${T[0]}</div><b>${esc(l.title)}</b>${l.score!=null?` <span class="pen" style="font-size:22px">${l.score}${l.scale==='IELTS'?'':'/10'}</span>`:''}${l.ok!=null?` <span class="small mut">${l.ok}/${l.n} câu đúng</span>`:''}${l.v>1?` <span class="chip">bản ${l.v}</span>`:''}</div><div class="row" style="gap:6px;justify-content:flex-end">${act}</div></div>`}
    body=`<div class="seg" id="lf">${[['all','Tất cả'],['learn','Bài học'],['write','Bài viết'],['drill','Luyện tập'],['win','Thành tích']].map(([k,l])=>`<button data-v="${k}" class="${LIBF===k?'on':''}">${l}</button>`).join('')}</div>
      <div class="sp">${o||'<p class="mut">Chưa có hoạt động nào. Mọi bài học, bài viết, lượt luyện tập sẽ được ghi lại ở đây.</p>'}</div>${list.length>LIBN?'<button class="btn" id="more">Xem thêm</button>':''}`}
  if(LIBT==='path')body=STAGES.map((st,i)=>{const b=S.boss[i],us=UNITS.filter(u=>u.stage===i),all=us.every(u=>S.done[u.id]);
    return `<section class="card sp"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Chặng ${i+1}: ${esc(st.name)}</h3><span class="chip ${all?'b':''}">${all?'Đã hoàn thành':us.filter(u=>S.done[u.id]).length+'/3 bài'}</span></div>
      ${us.map(u=>{const hs=hist.filter(h=>h.unit===u.id),lp=S.done[u.id]?3:(S.lp[u.id]??-1),f=hs[0],bst=hs.reduce((m,h)=>h.score!=null&&(m==null||h.score>m.score)?h:m,null);
        return `<div class="lrow"><div><b>${esc(u.title)}</b><div class="lsteps">${STEPN.map((s,j)=>`<span class="${j<=lp?'on':''}">${j<=lp?'✓':'○'} ${s}</span>`).join('')}</div>
          <div class="small mut">${hs.length?`${hs.length} lần viết · lần đầu ${fmtD(f.date)}${f.score!=null&&bst&&bst.score>f.score?` · tiến bộ ${f.score} → ${bst.score}`:''}`:S.done[u.id]?.skip?'Đã bỏ qua khi xếp trình độ':lp>=0?'Đang học':'Chưa học'}</div></div>
          <div class="lact">${bst?`<span class="pen" style="font-size:26px">${bst.score}</span>`:''}<a class="btn ghost" href="#lesson-${u.id}">${lp>=0?'Học lại':'Học'}</a>${hs.length?`<a class="btn ghost" href="#lesson-${u.id}-write">Viết lại</a>`:''}</div></div>`}).join('')}
      <div class="lrow"><div><b>Thử thách cuối chặng</b><div class="small mut">${b?'Điểm cao nhất '+b.best:'Chưa làm'}</div></div><div class="lact"><button class="btn ghost" data-boss="${i}">${b?'Làm lại':'Làm thử thách'}</button></div></div></section>`}).join('');
  if(LIBT==='theme')body=THEMES.map(t=>{const n=t.p.filter((_,i)=>S.wrote[t.id+'-'+i]!=null).length,hs=hist.filter(h=>h.theme===t.id);
    return `<details class="side"${n?' open':''}><summary>${esc(t.vi)} · <span class="mut">${n}/${t.p.length} đề · ${hs.length} bài</span></summary>
      ${t.p.map((p,i)=>{const pk=t.id+'-'+i,ph=hist.filter(h=>h.pk===pk),w=S.wrote[pk];
        return `<div class="lrow"><div><span class="small mut">${w!=null?'✓':'○'} ${LVC[p[0]]} · ${esc(GENRES[p[1]])}</span><div class="en">${esc(p[2])}</div>${ph.length?`<div class="small mut">${ph.length} lần · ${ph.map(h=>scoreTxt(h)).join(' → ')} · gần nhất ${fmtD(ph[ph.length-1].date)}</div>`:''}</div>
          <div class="lact">${w!=null?`<span class="pen" style="font-size:24px">${w}</span>`:''}<button class="btn ghost" data-tp="${pk}">${w!=null?'Viết lại':'Viết'}</button></div></div>`}).join('')}</details>`}).join('');
  if(LIBT==='write'){const q=LIBQ.toLowerCase(),gs=G.filter(a=>!q||a.some(h=>(h.title+' '+(h.ref?.prompt||'')).toLowerCase().includes(q))).sort((a,b)=>b[b.length-1].date.localeCompare(a[a.length-1].date));
    body=`<input type="text" id="lq" placeholder="Tìm theo tên bài hoặc đề…" value="${esc(LIBQ)}"><div class="sp">${gs.map(a=>{const l=a[a.length-1],f=a[0],up=a.length>1&&l.score!=null&&f.score!=null?l.score-f.score:null;
      return `<div class="lrow"><div><b>${esc(l.title)}</b>${l.ref?.prompt?`<div class="small en mut">${esc(l.ref.prompt.slice(0,140))}${l.ref.prompt.length>140?'…':''}</div>`:''}
        <div class="small">${a.length} lần · ${a.map(h=>scoreTxt(h)).join(' → ')}${up!=null?` <b style="color:${up>=0?'var(--ok)':'var(--red)'}">${up>=0?'▲ +':'▼ '}${+up.toFixed(1)}</b>`:''} · gần nhất ${fmtD(l.date)}</div></div>
        <div class="lact"><button class="btn ghost" data-view="${esc(l.id)}">Xem</button><button class="btn ghost" data-redo="${esc(l.id)}">Làm lại</button></div></div>`}).join('')||'<p class="mut">Chưa có bài viết nào.</p>'}</div>`}
  if(LIBT==='skill'){const ds=S.dstat||{},mxn=Math.max(1,...Object.values(ds).map(x=>x.n||0));const box=[S.vocab.filter(v=>!(v.box>0)).length,S.vocab.filter(v=>v.box>0&&v.box<4).length,known];
    const et={};S.errors.forEach(e=>et[e.t]=(et[e.t]||0)+1);
    body=`<div class="grid g2"><section class="card"><h3>Các dạng bài đã luyện</h3>${Object.keys(DT).map(t=>{const x=ds[t]||{n:0,ok:0};return `<div class="brow" style="grid-template-columns:9em minmax(0,1fr) 5.5em"><span class="small">${DT[t][0]}</span><div class="bar"><b style="width:${x.n/mxn*100}%"></b></div><span class="small">${x.n} câu · ${x.n?Math.round(x.ok/x.n*100):0}%</span></div>`}).join('')}
        <div class="row sp">${Object.keys(DT).map(t=>`<button class="btn ghost" data-gt="${t}" style="min-height:38px;padding:6px 12px">${DT[t][0]}</button>`).join('')}</div></section>
      <section class="card"><h3>Từ vựng</h3>${[['Mới lưu',box[0]],['Đang nhớ',box[1]],['Đã thuộc (mức 4+)',box[2]]].map(([l,n])=>`<div class="brow" style="grid-template-columns:9em minmax(0,1fr) 3em"><span class="small">${l}</span><div class="bar"><b style="width:${S.vocab.length?n/S.vocab.length*100:0}%;background:var(--ok)"></b></div><b>${n}</b></div>`).join('')}
        <p class="small mut">Đã ôn tổng cộng ${Object.values(S.vr).reduce((a,b)=>a+b,0)} lượt thẻ.</p><a class="btn ghost" href="#review">Ôn thẻ</a>
        <h3 class="sp">Lỗi đã sửa theo loại</h3>${Object.entries(et).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([t,n])=>`<div class="brow" style="grid-template-columns:9em minmax(0,1fr) 3em"><span class="small">${esc(t)}</span><div class="bar"><b style="width:${n/Math.max(...Object.values(et))*100}%;background:var(--red)"></b></div><b>${n}</b></div>`).join('')||'<p class="small mut">Chưa có.</p>'}</section></div>`}
  view.innerHTML=`<h1>Thư viện tiến bộ</h1><p class="mut">Mọi thứ bạn đã học, đã viết, đã luyện đều được ghi lại ở đây. Bấm vào bất kỳ mục nào để học lại hoặc làm lại.</p>
   <div class="lstats">${stat(doneU+'/18','bài học',"#library")}${stat(doneSt+'/6','chặng',"#map")}${stat(themesW+'/20','chủ đề đã viết',"#topics")}${stat(hist.length,'bài viết',"#library")}${stat(S.drillOk,'câu luyện đúng',"#gym")}${stat(known,'từ đã thuộc',"#review")}${stat(fmtH(S.time.total),'giờ luyện',"#hours")}</div>
   <section class="card sp"><h3>Nên làm lại hôm nay</h3><div class="grid g3">${sug.map((s,j)=>`<div class="eitem"><b>${esc(s.t)}</b><div class="small mut" style="margin:4px 0 10px">${esc(s.d)}</div><button class="btn pri" data-sug="${j}" style="min-height:40px">${s.b}</button></div>`).join('')}</div></section>
   <div class="tabs">${[['log','Nhật ký học'],['path','Lộ trình đã học'],['theme','Chủ đề'],['write','Bài viết & tiến bộ'],['skill','Kỹ năng']].map(([k,l])=>`<button class="${LIBT===k?'on':''}" data-t="${k}">${l}</button>`).join('')}</div>${body}`;
  $$('.tabs button').forEach(b=>b.onclick=()=>{LIBT=b.dataset.t;vLibrary()});
  $$('#lf button').forEach(b=>b.onclick=()=>{LIBF=b.dataset.v;LIBN=60;vLibrary()});
  $('#more')&&($('#more').onclick=()=>{LIBN+=60;vLibrary()});
  $$('[data-sug]').forEach(b=>b.onclick=()=>sug[+b.dataset.sug].f());
  $$('[data-redo]').forEach(b=>b.onclick=()=>redo(S.hist.find(h=>h.id===b.dataset.redo)));
  $$('[data-view]').forEach(b=>b.onclick=()=>showHist(b.dataset.view));
  $$('[data-dr]').forEach(b=>b.onclick=()=>redoDrill(logs.find(l=>l.id===b.dataset.dr)));
  $$('[data-boss]').forEach(b=>b.onclick=()=>openWrite(bossCtx(+b.dataset.boss)));
  $$('[data-tp]').forEach(b=>b.onclick=()=>{const [tid,ii]=b.dataset.tp.split(/-(?=\d+$)/);openWrite(refCtx({th:THEMES.findIndex(t=>t.id===tid),i:+ii,tw:null}))});
  $$('[data-gt]').forEach(b=>b.onclick=()=>gymRun(shuffle(poolOf(b.dataset.gt)).slice(0,6),DT[b.dataset.gt][0]));
  const lq=$('#lq');if(lq)lq.oninput=()=>{LIBQ=lq.value;clearTimeout(lq.t);lq.t=setTimeout(()=>{vLibrary();const n=$('#lq');n.focus();n.setSelectionRange(n.value.length,n.value.length)},350)}}

/* ============ router ============ */
function route(){clearInterval(timerI);closeModal();const h=location.hash.slice(1)||'today';
  KIND=null;if(h.startsWith('lesson-')){const m=h.slice(7).split('-');vLesson(m[0],m[1]==='write'?3:m[1]==='drill'?2:0)}else if(h.startsWith('topic-'))vTheme(h.slice(6));else if(h==='write')vWrite();else if(h==='vocab-bank'){VS='bank';vNotebook('voc')}else if(h==='sync')vNotebook('set');else ({today:vToday,map:vMap,gym:vGym,ielts:vIelts,notebook:()=>vNotebook(),topics:vTopics,hours:vHours,review:vReview,library:vLibrary}[h]||vToday)();
  header();window.scrollTo(0,0)}
addEventListener('hashchange',route);
migrate();route();
if(IN_CLAUDE)initCloud();else{setTimeout(()=>gistSync(false),800);if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})}
}

</script>
</body>
