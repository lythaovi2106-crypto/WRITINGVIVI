<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viết Mỗi Ngày</title>
<meta name="theme-color" content="#2b45d4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: an encouraging writing coach — calm, studious, a little playful when you win.
IDEA: a Vietnamese school exercise book (vở ô ly) marked by a teacher's red pen.
PICTURE: ruled notebook pages with a red margin line; red-pen circles for scores; highlighter marks on model texts; a conquest map of 18 lessons.
COLOUR and TYPE: ballpoint blue ground, paper white, red-pen accent, lime highlighter. Be Vietnam Pro for UI, Literata for English writing, Caveat for red-pen marks.
LAYOUT: blue header band with stats and tabs; one page per view, content 1100px; stacks to a single column under 600px.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f3f4f8,#0e1230);--paper:light-dark(#ffffff,#171c42);--paper2:light-dark(#f7f8fc,#1d2350);
--ink:light-dark(#141a3a,#e9ebf7);--mut:light-dark(#5a6083,#a7acd0);--line:light-dark(#dfe3f1,#2c3366);
--rule:light-dark(#e6ebf7,#232a5c);
--blue:#2b45d4;--blue2:light-dark(#2b45d4,#8ea0ff);--band:light-dark(#2b45d4,#1a2470);
--red:light-dark(#d9342b,#ff6b60);--hl:light-dark(#d9f99d,#4d6b14);--hlink:light-dark(#1d3a00,#eaffc2);
--ok:light-dark(#0f8a5f,#4fd3a0);--okbg:light-dark(#e3f7ee,#123d33);--badbg:light-dark(#fde8e6,#4a1f22);
--warn:light-dark(#b86e00,#ffc25e);--r:14px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.15;margin:0 0 .4em;text-wrap:balance}
h1{font-size:clamp(28px,4vw,40px);font-weight:800}h2{font-size:24px;font-weight:800}h3{font-size:18px;font-weight:700}
p{margin:0 0 .7em}a{color:var(--blue2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(4vw,16px)}
.mut{color:var(--mut)}.small{font-size:14px}.en{font-family:Literata,Georgia,serif}
.pen{font-family:Caveat,cursive;color:var(--red);font-weight:700}

/* header */
header{background:var(--band);color:#fff}
.top{display:flex;align-items:center;gap:14px;padding:14px 0 6px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:#fff;text-decoration:none;margin-right:auto}
.logo svg{flex:none}
.stat{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.stat svg{flex:none}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;color:#dfe4ff;text-decoration:none;padding:12px 14px 13px;font-weight:600;font-size:15px;border-bottom:3px solid transparent}
nav a.on{color:#fff;border-color:#ff8a80}
main{padding:28px 0 80px}

/* surfaces */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{margin-top:18px}.sp2{margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-size:15px}
.btn:hover{border-color:var(--blue2)}a.btn{text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--paper2);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
.chip.b{background:var(--blue);color:#fff;border-color:var(--blue)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:14px}
.seg button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
input[type=text],select,textarea{width:100%;font-size:16px;padding:11px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper)}
textarea{resize:vertical}

/* notebook page */
.page{position:relative;background:var(--paper);border-radius:var(--r);border:1px solid var(--line);
background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-position:0 14px;padding:18px 20px 22px 58px}
.page::before{content:"";position:absolute;left:40px;top:0;bottom:0;width:2px;background:light-dark(#f2a6a0,#7a3a44)}
.page .en{font-size:18px;line-height:32px}
.ed{display:block;width:100%;min-height:340px;border:0;background:transparent;resize:vertical;font:18px/32px Literata,Georgia,serif;padding:0;outline:none}
.page:focus-within{border-color:var(--blue2)}

/* hero today */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
@media(max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.mission h1{font-family:Literata,serif;font-weight:600;font-size:clamp(28px,4vw,40px);margin:.1em 0 .3em}
.track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:16px 0 18px}
.track div{border-top:4px solid var(--line);padding-top:6px;font-size:13px;font-weight:600;color:var(--mut)}
.track div.on{border-color:var(--red);color:var(--ink)}
.week{display:flex;gap:6px;margin:10px 0}
.week span{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.week i{display:block;height:34px;border-radius:9px;background:var(--paper2);border:1.5px solid var(--line);margin-bottom:4px}
.week i.on{background:var(--red);border-color:var(--red)}
.bar{height:10px;border-radius:9px;background:var(--paper2);overflow:hidden;border:1px solid var(--line)}
.bar b{display:block;height:100%;background:var(--blue2);border-radius:9px}

/* map */
.stage{margin-bottom:26px}
.stage h3 span{color:var(--mut);font-weight:500;font-size:15px}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px;margin-top:10px}
.node{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;min-height:92px;width:100%}
.node .n{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2.5px solid var(--line);background:var(--paper2)}
.node.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.node.cur{border-color:var(--red)}.node.cur .n{border-color:var(--red);color:var(--red)}
.node b{display:block;font-size:15px;line-height:1.3}
.node small{color:var(--mut);font-size:13px}

/* lesson */
.steps{display:flex;gap:6px;overflow-x:auto;margin:16px 0 18px;scrollbar-width:thin}
.steps button{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-weight:700;font-size:14px}
.steps button i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--paper2);font-size:12px}
.steps button.on{border-color:var(--blue);background:var(--blue);color:#fff}.steps button.on i{background:#fff;color:var(--blue)}
.theory ul,.theory ol{padding-left:1.2em;margin:0 0 .7em}.theory li{margin:.25em 0}
.theory u{text-decoration-color:var(--red);text-decoration-thickness:2px}
.frames{display:grid;gap:8px}
.frame{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;padding:10px 12px;border-radius:10px;background:var(--paper2);border:1px solid var(--line)}
.frame b{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--blue2)}
@media(max-width:600px){.frame{grid-template-columns:minmax(0,1fr)}}
.voc{display:flex;flex-wrap:wrap;gap:8px}
.voc span{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:14px}
.voc span b{font-family:Literata,serif;font-weight:600}
.ann{background:linear-gradient(transparent 55%,color-mix(in srgb,var(--c) 28%,transparent) 55%);border-radius:2px;cursor:help}
.ann .tag{font:700 12px/1 "Be Vietnam Pro",sans-serif;color:var(--c);vertical-align:super;margin-right:3px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.legend span{font-size:13px;font-weight:600;color:var(--c)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px}

/* mind map */
.mm{position:relative;width:100%}
.mm svg{display:block;width:100%}
.mm text{font-family:"Be Vietnam Pro",sans-serif}

/* drills */
.drill{max-width:760px}
.dq{font-size:18px;margin-bottom:12px}
.wrongs{font-family:Literata,serif;font-size:19px;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.slot{min-height:56px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{min-height:44px;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);font:17px Literata,serif;box-shadow:0 2px 0 var(--line)}
.opt{display:block;width:100%;text-align:left;min-height:48px;padding:10px 14px;margin:6px 0;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-size:16px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--red);background:var(--badbg)}
.fb{margin-top:14px;padding:14px 16px;border-radius:12px;border:1.5px solid}
.fb.ok{border-color:var(--ok);background:var(--okbg)}.fb.no{border-color:var(--red);background:var(--badbg)}
.prog{display:flex;gap:4px;margin-bottom:14px}.prog i{flex:1;height:6px;border-radius:6px;background:var(--line)}.prog i.on{background:var(--blue2)}.prog i.ok{background:var(--ok)}.prog i.no{background:var(--red)}
.gamecard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:18px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--paper);min-height:150px;width:100%}
.gamecard:hover{border-color:var(--blue2)}
.gamecard .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--paper2);color:var(--blue2);margin-bottom:4px}

/* writing */
.wlay{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:900px){.wlay{grid-template-columns:minmax(0,1fr)}}
.prompt{white-space:pre-line;font-family:Literata,serif;font-size:17px}
.wbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0}
.count{font-weight:700;white-space:nowrap}
.timer{font:700 22px/1 Caveat,cursive;color:var(--red);white-space:nowrap}
.plan input{margin-top:6px}
details.side{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:0 14px;margin-bottom:10px}
details.side summary{cursor:pointer;font-weight:700;padding:12px 0;min-height:44px}
details.side[open]{padding-bottom:14px}

/* feedback */
.fbhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.ring{width:118px;height:118px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0}
.ring b{font:700 46px/1 Caveat,cursive;color:var(--red)}
.ring small{position:absolute;bottom:20px;font-size:12px;color:var(--mut);font-weight:600}
.crit{display:grid;gap:10px}
.crit .l{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
.crit .l span:last-child{white-space:nowrap}
.marked{font:18px/34px Literata,Georgia,serif;white-space:pre-wrap}
.err{position:relative}
.err s{text-decoration-color:var(--red);text-decoration-thickness:2px;color:var(--mut)}
.err ins{text-decoration:none;font:700 21px/1 Caveat,cursive;color:var(--red);margin-left:4px}
.elist{display:grid;gap:10px}
.eitem{padding:12px 14px;border-radius:12px;background:var(--paper2);border:1px solid var(--line)}
.eitem .o{font-family:Literata,serif;text-decoration:line-through;text-decoration-color:var(--red);color:var(--mut)}
.eitem .c{font-family:Literata,serif;color:var(--ok);font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1.5px solid var(--line);margin:18px 0 14px}
.tabs button{flex:none;border:0;background:none;padding:10px 12px;font-weight:700;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1.5px;min-height:44px}
.tabs button.on{color:var(--ink);border-color:var(--red)}
.chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.chk i{flex:none;font-style:normal;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;background:var(--ok)}
.chk i.x{background:var(--red)}
.loading{display:flex;align-items:center;gap:12px;padding:18px;border-radius:12px;background:var(--paper2);border:1px dashed var(--line)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--red);animation:p 1s infinite alternate}
@keyframes p{to{transform:scale(.5);opacity:.4}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}

/* notebook + misc */
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.hrow:hover b{color:var(--blue2)}
.brow{display:grid;grid-template-columns:9em minmax(0,1fr) 2.5em;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.brow .bar b{background:var(--red)}
.modal{position:fixed;inset:0;background:rgba(10,14,40,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:50;overflow-y:auto}
.modal.on{display:flex}
.modal>.card{width:min(860px,100%)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:360px;overflow-y:auto;margin:10px 0}
.msg{padding:10px 13px;border-radius:12px;background:var(--paper2);border:1px solid var(--line);white-space:pre-wrap;font-size:15px}
.msg.me{background:var(--blue);color:#fff;border-color:var(--blue);align-self:flex-end;max-width:85%}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:700;z-index:60;display:none;max-width:90vw}
.note{font-size:13px;color:var(--mut);margin-top:8px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:14px}
.badge.off{opacity:.4}
.scroll{overflow-x:auto}
.ptab{border-collapse:collapse;font:15px/1.4 "Be Vietnam Pro",sans-serif;margin:8px 0;white-space:normal}.ptab th,.ptab td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.ptab th:first-child,.ptab td:first-child{text-align:left}.ptab th{background:var(--paper2)}
@media(max-width:600px){.page{padding-left:46px}.page::before{left:30px}.fbhead{grid-template-columns:minmax(0,1fr)}.brow{grid-template-columns:7em minmax(0,1fr) 2em}main{padding-top:20px}}

/* v2 */
.twist{margin:12px 0 0;padding:9px 12px;border-left:4px solid var(--red);background:var(--badbg);border-radius:8px;font-size:15px}
.big{font:800 clamp(52px,9vw,84px)/1 "Be Vietnam Pro",sans-serif;letter-spacing:-.02em}
.ruler{position:relative;height:46px;margin:14px 6px 0}
.ruler .tr,.ruler .fill{position:absolute;left:0;top:12px;height:12px;border-radius:9px}
.ruler .tr{right:0;background:var(--paper2);border:1px solid var(--line)}.ruler .fill{background:var(--red);min-width:6px}
.ruler .tk{position:absolute;top:6px;width:2px;height:24px;background:var(--ink);opacity:.35}
.ruler .tk span{position:absolute;top:26px;left:1px;transform:translateX(-50%);font-size:12px;color:var(--mut);white-space:nowrap}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;width:max-content}
.heat i{border-radius:3px;background:var(--paper2);border:1px solid var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--red) 30%,var(--paper))}.heat i.l2{background:color-mix(in srgb,var(--red) 62%,var(--paper))}.heat i.l3{background:var(--red);border-color:var(--red)}
.mile{display:grid;grid-template-columns:6.5em minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line)}
.mile b.h{white-space:nowrap}.mile.ok b.h{color:var(--ok)}.mile.now{background:var(--paper2);border-radius:10px;border:1.5px solid var(--red)}
table.rub{width:100%;border-collapse:collapse;font-size:14px}.rub th,.rub td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.rub th{background:var(--paper2);font-weight:700}
.stg{margin-bottom:16px;border-width:1.5px}.stg.now{border-color:var(--red)}.stg.done{opacity:.92}
.stg .num{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:20px;background:var(--paper2);border:2.5px solid var(--line)}
.stg.now .num{background:var(--red);border-color:var(--red);color:#fff}.stg.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.stg .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px}
@media(max-width:760px){.stg .cols{grid-template-columns:minmax(0,1fr)}}
.sample{font-size:17px;padding:10px 14px;border-radius:10px;background:var(--paper2);border-left:4px solid var(--blue2);margin:0}
.dots{display:flex;gap:4px;margin-top:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ok)}
.node.boss{border-style:dashed;border-color:var(--red)}.node.boss .n{background:var(--red);border-color:var(--red);color:#fff}.node.boss.done .n{background:var(--ok);border-color:var(--ok)}
.phase{position:relative;margin:28px 0 0 12px;padding-left:26px;border-left:3px solid var(--line)}
.phase>h2{position:relative}.phase>h2::before{content:"";position:absolute;left:-39px;top:3px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:4px solid var(--blue2)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fstep{padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper2);display:flex;flex-direction:column;gap:4px}
.fstep.on{border-color:var(--red);background:var(--badbg)}.fstep.ok{border-color:var(--ok);background:var(--okbg)}
@media(max-width:700px){.flow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.spin{min-height:150px;padding:16px;border-radius:12px;border:2px dashed var(--line);background:var(--paper2)}
a.gamecard{color:inherit;text-decoration:none}
.flash{max-width:620px;margin:0 auto;text-align:center}.flash .w{font:600 clamp(32px,6vw,46px)/1.2 Literata,Georgia,serif;margin:22px 0}
@media(max-width:600px){.mile{grid-template-columns:5.5em minmax(0,1fr)}.mile .chip{display:none}.phase{padding-left:18px;margin-left:8px}.phase>h2::before{left:-31px}
 .stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;font-weight:700}.stack td:first-child{padding-inline-start:0}}

/* v4 thư viện */
.lstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,128px),1fr));gap:10px;margin-top:14px}
.lstat{display:flex;flex-direction:column;gap:2px;padding:14px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);color:inherit;text-decoration:none}

.lday{font-size:15px;margin:22px 0 6px;color:var(--mut)}

.lentry>i{width:12px;height:12px;border-radius:50%}

.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lact{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lsteps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.lsteps span{font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--paper2);border:1px solid var(--line);color:var(--mut)}
.lsteps span.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
@media(max-width:600px){.lentry{grid-template-columns:12px minmax(0,1fr)}.lentry>div:last-child{grid-column:2;justify-content:flex-start}.lrow{grid-template-columns:minmax(0,1fr)}.lact{justify-content:flex-start}}

<script>

window.STAGES = [
  {name:'Nền móng câu', en:'Sentence foundations', desc:'Viết đúng một câu tiếng Anh: chủ ngữ, động từ, thì, mở rộng câu.'},
  {name:'Nối câu', en:'Combining sentences', desc:'Ghép các câu ngắn thành câu dài, mạch lạc như người bản xứ.'},
  {name:'Đoạn văn', en:'Paragraphs', desc:'Câu chủ đề, triển khai ý theo PEEL, từ nối và liên kết.'},
  {name:'Viết giao tiếp', en:'Real-life writing', desc:'Tin nhắn, email thân mật và trang trọng, kể chuyện, miêu tả.'},
  {name:'Bài luận', en:'Essays', desc:'Bố cục 4 đoạn, paraphrase, các dạng opinion, discussion, problem–solution.'},
  {name:'IELTS Writing', en:'IELTS', desc:'Task 1 (biểu đồ / thư) và Task 2 theo 4 tiêu chí chấm chính thức.'}
];

window.UNITS = [
/* ================= STAGE 1 ================= */
{id:'u1',stage:0,title:'Câu đơn: 5 mẫu câu gốc',en:'The 5 basic sentence patterns',min:15,
goal:'Viết được câu đơn đúng ngữ pháp, không thiếu động từ.',
theory:`<p>Mọi câu tiếng Anh đều cần <b>chủ ngữ (S)</b> và <b>động từ (V)</b>. Tiếng Việt cho phép nói "Cô ấy rất đẹp" mà không có động từ, nhưng tiếng Anh <b>bắt buộc</b> phải có: <i>She <u>is</u> very beautiful.</i></p>
<p>Gần như mọi câu bạn viết đều là một trong 5 mẫu sau. Thuộc 5 mẫu này là bạn đã có "khung xương" cho mọi bài viết.</p>
<p><b>3 lỗi người Việt hay mắc nhất:</b> (1) quên động từ <i>be</i> trước tính từ, (2) dùng <i>be</i> + động từ thường ("I am agree"), (3) quên thêm <i>-s</i> cho động từ khi chủ ngữ là he/she/it.</p>`,
frames:[{f:'S + V',ex:'The baby sleeps.'},{f:'S + V + O',ex:'I drink coffee every morning.'},{f:'S + be/seem/become + C',ex:'My boss is very kind.'},{f:'S + V + O + O',ex:'My mother gave me a book.'},{f:'S + V + O + C',ex:'The news made me happy.'}],
vocab:[['wake up','thức dậy'],['have breakfast','ăn sáng'],['commute','đi lại (đi làm)'],['usually','thường thường'],['finish work','tan làm'],['relax','thư giãn']],
model:{title:'My Morning',text:`{{S+V::I wake up}} at six o'clock. {{S+V+O::I drink a glass of water}} and then I cook breakfast. {{S+be+C::My breakfast is simple}}: bread and eggs. {{S+V+O+O::My wife makes me a cup of coffee}}. {{S+V+O+C::Coffee keeps me awake}} all morning. After that, I ride my motorbike to work.`},
mind:{c:'My daily routine',b:[{l:'Morning',k:['wake up 6am','breakfast','commute']},{l:'Work',k:['meetings','emails','lunch']},{l:'Evening',k:['cook dinner','relax','sleep 11pm']},{l:'Feelings',k:['busy','tired','happy']}]},
drills:{
scramble:[{w:['I','coffee','drink','every','morning'],a:'I drink coffee every morning'},{w:['is','My','very','boss','kind'],a:'My boss is very kind'},{w:['gave','My','me','a book','mother'],a:'My mother gave me a book'}],
fix:[{w:'She very kind.',r:['She is very kind.'],y:'Thiếu động từ "be" trước tính từ.'},{w:'I am agree with you.',r:['I agree with you.'],y:'"agree" là động từ thường, không dùng với "am".'},{w:'He go to work by bus.',r:['He goes to work by bus.'],y:'Chủ ngữ he/she/it → động từ thêm -s/-es.'}],
trans:[{vi:'Tôi thường uống trà vào buổi tối.',en:['I usually drink tea in the evening.']},{vi:'Căn phòng của tôi rất nhỏ.',en:['My room is very small.']}]},
task:{type:'Đoạn văn ngắn',p:'Write 6–8 simple sentences about your daily routine.',vi:'Viết 6–8 câu đơn về một ngày bình thường của bạn. Dùng ít nhất 3 trong 5 mẫu câu.',min:60,max:100,check:['Câu nào cũng có chủ ngữ và động từ','Dùng ít nhất 3 mẫu câu khác nhau','Động từ thêm -s với he/she/it']}},

{id:'u2',stage:0,title:'3 thì nền tảng',en:'Present, past and future',min:15,
goal:'Chọn đúng thì để kể thói quen, chuyện đã qua và kế hoạch.',
theory:`<p>Tiếng Việt dùng "đã, đang, sẽ"; tiếng Anh thì <b>đổi hình dạng động từ</b>. Với người mới, chỉ cần vững 3 thì:</p>
<ul><li><b>Hiện tại đơn</b> – thói quen, sự thật: <i>I <u>work</u> in an office.</i></li>
<li><b>Quá khứ đơn</b> – việc đã xong, có thời gian rõ: <i>Last week, I <u>visited</u> Da Lat.</i></li>
<li><b>Tương lai</b> – <i>will</i> (quyết định/dự đoán), <i>be going to</i> (kế hoạch có sẵn): <i>I <u>am going to</u> learn English.</i></li></ul>
<p><b>Mẹo:</b> nhìn từ chỉ thời gian. <i>every day, usually</i> → hiện tại; <i>yesterday, last…, ago</i> → quá khứ; <i>tomorrow, next…</i> → tương lai.</p>`,
frames:[{f:'S + V(s/es) + every…',ex:'She cooks dinner every evening.'},{f:'Last…/ …ago, S + V-ed/V2',ex:'Two days ago, we went to the beach.'},{f:'Next…, S + am/is/are going to + V',ex:'Next month, I am going to move house.'},{f:'I think S + will + V',ex:'I think it will rain tomorrow.'}],
vocab:[['last weekend','cuối tuần trước'],['go out with friends','đi chơi với bạn'],['stay at home','ở nhà'],['plan to','dự định'],['looking forward to','mong chờ'],['visit my parents','thăm bố mẹ']],
model:{title:'Two Weekends',text:`{{Present::I usually stay at home on Saturdays.}} {{Past::But last weekend, I went to Vung Tau with my friends. We swam in the sea and ate a lot of seafood.}} {{Past::It was tiring but fun.}} {{Future::Next weekend, I am going to visit my parents.}} {{Future::I think my mother will cook my favourite soup.}}`},
mind:{c:'My weekends',b:[{l:'Usually',k:['stay home','clean house','watch films']},{l:'Last weekend',k:['went to…','ate…','felt…']},{l:'Next weekend',k:['going to visit','will…']}]},
drills:{
scramble:[{w:['Last','I','went','Sunday,','to the market'],a:'Last Sunday, I went to the market'},{w:['am','I','going to','learn','to cook'],a:'I am going to learn to cook'}],
fix:[{w:'Yesterday I go to the cinema.',r:['Yesterday I went to the cinema.','Yesterday, I went to the cinema.'],y:'Có "yesterday" → quá khứ đơn: go → went.'},{w:'Next year I will to travel to Japan.',r:['Next year I will travel to Japan.','Next year, I will travel to Japan.'],y:'Sau "will" là động từ nguyên mẫu, không có "to".'},{w:'She usually is late.',r:['She is usually late.'],y:'Trạng từ tần suất đứng SAU động từ "be".'}],
trans:[{vi:'Tuần trước tôi đã gặp một người bạn cũ.',en:['Last week, I met an old friend.','I met an old friend last week.']},{vi:'Ngày mai tôi sẽ dậy sớm.',en:['I will get up early tomorrow.','Tomorrow I will get up early.','I am going to get up early tomorrow.']}]},
task:{type:'Đoạn văn',p:'Write about what you usually do at weekends, what you did last weekend and what you will do next weekend.',vi:'Viết về cuối tuần thường ngày, cuối tuần trước và kế hoạch cuối tuần tới. Dùng cả 3 thì.',min:80,max:120,check:['Có đủ 3 thì','Có từ chỉ thời gian ở mỗi phần','Động từ quá khứ chia đúng']}},

{id:'u3',stage:0,title:'Mở rộng câu với 5W1H',en:'Expanding sentences',min:15,
goal:'Biến câu cụt thành câu giàu thông tin bằng tính từ, trạng từ, cụm giới từ.',
theory:`<p>Câu "I eat." đúng nhưng nghèo. Hãy hỏi câu của bạn 6 câu hỏi: <b>Who? What? Where? When? Why? How?</b> rồi gắn câu trả lời vào:</p>
<p><i>I eat.</i> → <i>I eat <u>pho</u>.</i> → <i>I eat <u>a bowl of hot</u> pho.</i> → <i><u>Every morning</u>, I <u>quickly</u> eat a bowl of hot pho <u>at a small shop near my office</u>.</i></p>
<p><b>Trật tự chuẩn:</b> (Khi nào,) S + (trạng từ tần suất) + V + O + <b>cách thức → nơi chốn → thời gian</b>. Tính từ đứng <b>trước</b> danh từ (khác tiếng Việt!): <i>a <u>quiet</u> café</i>, không phải "a café quiet".</p>`,
frames:[{f:'adj + noun',ex:'a quiet little café'},{f:'S + V + O + how + where + when',ex:'I read books quietly in my room every night.'},{f:'Time phrase, S + V …',ex:'On rainy days, I stay inside and read.'},{f:'… because + reason',ex:'I love this park because it is peaceful.'}],
vocab:[['peaceful','yên bình'],['crowded','đông đúc'],['cosy','ấm cúng'],['view','quang cảnh'],['spend time','dành thời gian'],['especially','đặc biệt là']],
model:{title:'My Favourite Place',text:`{{What + Where::My favourite place is a small coffee shop near Hoan Kiem Lake.}} {{How (adj)::It is quiet and cosy, with old wooden tables and soft music.}} {{When::Every Sunday morning,}} I sit by the window and read a book. {{Why::I love this place because it helps me forget my busy week.}} {{How (adv)::The owner always greets me warmly.}}`},
mind:{c:'My favourite place',b:[{l:'Where',k:['near the lake','district 1']},{l:'What it looks like',k:['quiet','cosy','wooden tables']},{l:'What I do',k:['read','drink tea']},{l:'Why',k:['relax','forget stress']}]},
drills:{
scramble:[{w:['a','I','quiet','found','café'],a:'I found a quiet café'},{w:['every night','reads','She','in bed','quietly'],a:'She reads quietly in bed every night'}],
fix:[{w:'I like the house big.',r:['I like the big house.'],y:'Tính từ đứng trước danh từ.'},{w:'I go every day to the gym.',r:['I go to the gym every day.'],y:'Nơi chốn trước, thời gian sau.'},{w:'It is a place very beautiful.',r:['It is a very beautiful place.'],y:'very + adj + noun.'}],
trans:[{vi:'Mỗi tối tôi đi bộ chậm rãi quanh công viên gần nhà.',en:['Every evening, I walk slowly around the park near my house.','I walk slowly around the park near my house every evening.']},{vi:'Đó là một nhà hàng nhỏ nhưng rất sạch sẽ.',en:['It is a small but very clean restaurant.']}]},
task:{type:'Miêu tả',p:'Describe your favourite place. Where is it, what is it like, what do you do there and why do you like it?',vi:'Miêu tả nơi bạn thích nhất. Mỗi câu cố gắng trả lời thêm 1–2 câu hỏi 5W1H.',min:80,max:120,check:['Có ít nhất 4 tính từ đứng trước danh từ','Có cụm chỉ nơi chốn và thời gian','Có 1 câu "because"']}},

/* ================= STAGE 2 ================= */
{id:'u4',stage:1,title:'Câu ghép: and, but, so, or',en:'Compound sentences',min:15,
goal:'Nối 2 câu đơn bằng liên từ, đặt dấu phẩy đúng chỗ.',
theory:`<p>Hai câu đơn liên quan đến nhau có thể nối bằng <b>, and / , but / , so / , or</b> (cùng với for, nor, yet – gọi chung là FANBOYS).</p>
<ul><li><b>and</b> – thêm ý: <i>I work hard, and I save money.</i></li><li><b>but</b> – đối lập: <i>The job is stressful, but the salary is good.</i></li><li><b>so</b> – kết quả: <i>It was raining, so we stayed home.</i></li><li><b>or</b> – lựa chọn: <i>You can call me, or you can send an email.</i></li></ul>
<p><b>Lỗi kinh điển:</b> nối hai câu chỉ bằng dấu phẩy ("I was tired, I went to bed") – gọi là <i>comma splice</i>. Phải có liên từ hoặc dấu chấm.</p>`,
frames:[{f:'S + V, and S + V',ex:'My office is far, and the traffic is terrible.'},{f:'S + V, but S + V',ex:'I like my job, but I want more free time.'},{f:'S + V, so S + V',ex:'I missed the bus, so I was late.'},{f:'S + V, or S + V',ex:'We can eat out, or I can cook.'}],
vocab:[['colleague','đồng nghiệp'],['deadline','hạn chót'],['salary','lương'],['challenging','thử thách'],['work overtime','làm thêm giờ'],['learn new skills','học kỹ năng mới']],
model:{title:'My Job',text:`I work as an accountant in a small company. {{and::My office is near my house, and I can walk there in ten minutes.}} {{but::The work is sometimes boring, but my colleagues are very friendly.}} {{so::We often have deadlines at the end of the month, so I work overtime.}} {{or::In the future, I will get a promotion, or I will start my own business.}}`},
mind:{c:'My job / studies',b:[{l:'What I do',k:['accountant','reports']},{l:'Good points (and)',k:['friendly colleagues','near home']},{l:'Bad points (but)',k:['boring','overtime']},{l:'Future (or)',k:['promotion','own business']}]},
drills:{
combine:[{a:'It was very hot.',b:'We went swimming.',h:'so',r:['It was very hot, so we went swimming.']},{a:'I want to buy a car.',b:'I do not have enough money.',h:'but',r:['I want to buy a car, but I do not have enough money.',"I want to buy a car, but I don't have enough money."]},{a:'You can take a taxi.',b:'You can take the bus.',h:'or',r:['You can take a taxi, or you can take the bus.','You can take a taxi or the bus.']}],
fix:[{w:'I was tired, I went to bed early.',r:['I was tired, so I went to bed early.','I was tired. I went to bed early.'],y:'Comma splice: thêm "so" hoặc tách 2 câu.'},{w:'Because it rained so we stayed home.',r:['Because it rained, we stayed home.','It rained, so we stayed home.'],y:'Không dùng cả "because" và "so" trong một câu.'}],
scramble:[{w:['tired,','I','was','but','I','finished','the report'],a:'I was tired, but I finished the report'}],
trans:[{vi:'Công việc này khó nhưng tôi học được rất nhiều.',en:['This job is difficult, but I learn a lot.','The job is hard, but I learn a lot.']}]},
task:{type:'Đoạn văn',p:'Write about your job or your studies. What do you like and dislike about it?',vi:'Viết về công việc/việc học của bạn. Dùng ít nhất 4 câu ghép với and, but, so, or.',min:90,max:130,check:['Có ít nhất 4 câu ghép','Có dấu phẩy trước liên từ','Không có comma splice']}},

{id:'u5',stage:1,title:'Câu phức: because, although, when, if',en:'Complex sentences',min:20,
goal:'Dùng mệnh đề phụ để nói lý do, nhượng bộ, thời gian, điều kiện.',
theory:`<p>Câu phức = <b>mệnh đề chính</b> + <b>mệnh đề phụ</b> bắt đầu bằng <i>because, although, when, while, if, before, after, until</i>.</p>
<p><b>Quy tắc dấu phẩy:</b> mệnh đề phụ đứng <b>đầu</b> câu → có dấu phẩy. Đứng <b>sau</b> → không cần.<br><i>Although it was late, I kept working.</i> / <i>I kept working although it was late.</i></p>
<p><b>Bẫy dịch từ tiếng Việt:</b> "Tuy… <u>nhưng</u>…" và "Vì… <u>nên</u>…". Tiếng Anh chỉ dùng <b>một</b> từ: <s>Although it was late, but…</s> ❌ → <i>Although it was late, I…</i> ✅</p>
<p><b>Câu điều kiện loại 1:</b> <i>If + hiện tại, S + will + V</i>: <i>If I save money, I will travel.</i> (không dùng "will" sau "if").</p>`,
frames:[{f:'Because S + V, S + V',ex:'Because I wanted a change, I quit my job.'},{f:'Although S + V, S + V',ex:'Although it was risky, I decided to try.'},{f:'When S + V(past), S + V(past)',ex:'When I graduated, I moved to Saigon.'},{f:'If S + V(present), S + will + V',ex:'If I fail, I will try again.'}],
vocab:[['make a decision','đưa ra quyết định'],['risky','rủi ro'],['regret','hối hận'],['opportunity','cơ hội'],['in the end','cuối cùng'],['turn out','hóa ra']],
model:{title:'A Big Decision',text:`{{When::When I was 25, I made a big decision.}} I left my stable job in Hanoi and moved to Da Nang. {{Because::I did this because I wanted to live near the sea.}} {{Although::Although my parents were worried, they supported me.}} The first year was hard. {{If::Now I always tell my friends: if you really want something, you will find a way.}}`},
mind:{c:'A decision I made',b:[{l:'When',k:['age 25','after graduating']},{l:'What',k:['left job','moved city']},{l:'Why (because)',k:['wanted change','near the sea']},{l:'Difficulty (although)',k:['parents worried','no friends']},{l:'Result',k:['happier','learned a lot']}]},
drills:{
combine:[{a:'It was raining.',b:'We went out.',h:'although',r:['Although it was raining, we went out.','We went out although it was raining.']},{a:'I was tired.',b:'I went to bed early.',h:'because',r:['Because I was tired, I went to bed early.','I went to bed early because I was tired.']},{a:'You study every day.',b:'You will improve.',h:'if',r:['If you study every day, you will improve.','You will improve if you study every day.']}],
fix:[{w:'Although he is rich, but he is not happy.',r:['Although he is rich, he is not happy.','He is rich, but he is not happy.'],y:'"Although" và "but" không đi cùng nhau.'},{w:'If it will rain tomorrow, I will stay home.',r:['If it rains tomorrow, I will stay home.'],y:'Sau "if" dùng hiện tại đơn, không dùng "will".'},{w:'Because I was sick so I stayed home.',r:['Because I was sick, I stayed home.','I was sick, so I stayed home.'],y:'"Because" và "so" không đi cùng nhau.'}],
trans:[{vi:'Mặc dù lương thấp, tôi vẫn thích công việc này.',en:['Although the salary is low, I still like this job.','Although the salary is low, I like this job.']},{vi:'Nếu bạn cần giúp đỡ, tôi sẽ gọi cho bạn.',en:['If you need help, I will call you.']}]},
task:{type:'Kể chuyện',p:'Write about an important decision you made. Why did you make it, what was difficult, and what was the result?',vi:'Kể về một quyết định quan trọng. Dùng because, although, when và if (mỗi từ ít nhất 1 lần).',min:100,max:150,check:['Có đủ because / although / when / if','Không dùng although…but, because…so','Dấu phẩy đúng khi mệnh đề phụ đứng đầu']}},

{id:'u6',stage:1,title:'Mệnh đề quan hệ: who, which, that',en:'Relative clauses',min:20,
goal:'Gộp thông tin về người/vật vào một câu bằng who, which, that, where.',
theory:`<p>Thay vì viết 2 câu: <i>I have a friend. She lives in Canada.</i> → gộp lại: <i>I have a friend <u>who lives in Canada</u>.</i></p>
<ul><li><b>who</b> – người; <b>which</b> – vật; <b>that</b> – cả hai (mệnh đề xác định); <b>where</b> – nơi chốn; <b>whose</b> – sở hữu.</li></ul>
<p><b>Có dấu phẩy hay không?</b> Nếu thông tin chỉ là <i>bổ sung</i> (bỏ đi câu vẫn rõ) → có dấu phẩy và không dùng "that": <i>My father, <u>who is 60</u>, still works.</i></p>
<p><b>Nâng cấp:</b> rút gọn bằng V-ing: <i>the man <u>who is standing</u> there</i> → <i>the man <u>standing</u> there</i>.</p>`,
frames:[{f:'N (person) + who + V',ex:'She is a teacher who inspires her students.'},{f:'N (thing) + which/that + V',ex:'This is the book that changed my life.'},{f:'N (place) + where + S + V',ex:'Hue is the city where I grew up.'},{f:'N, who/which …, V',ex:'My uncle, who is a doctor, works very long hours.'}],
vocab:[['influence','ảnh hưởng'],['inspire','truyền cảm hứng'],['patient','kiên nhẫn'],['role model','hình mẫu'],['grow up','lớn lên'],['look up to','ngưỡng mộ']],
model:{title:'A Person Who Inspired Me',text:`The person {{who::who influenced me the most}} is my grandmother. She lived in a small village {{where::where everyone knew each other}}. She had a garden {{which::which was full of vegetables and flowers}}. My grandmother, {{non-defining::who never went to university}}, taught me many important lessons. The most important lesson {{that::that I learned from her}} is to be patient.`},
mind:{c:'A person who inspired me',b:[{l:'Who',k:['grandmother','teacher']},{l:'Appearance / character',k:['patient','kind','hard-working']},{l:'Story',k:['garden','village life']},{l:'Lesson',k:['be patient','help others']}]},
drills:{
combine:[{a:'I have a friend.',b:'She speaks five languages.',h:'who',r:['I have a friend who speaks five languages.','I have a friend that speaks five languages.']},{a:'This is the café.',b:'We first met there.',h:'where',r:['This is the café where we first met.']},{a:'I bought a laptop.',b:'It was very expensive.',h:'which',r:['I bought a laptop which was very expensive.','I bought a laptop that was very expensive.']}],
fix:[{w:'The man which lives next door is a doctor.',r:['The man who lives next door is a doctor.','The man that lives next door is a doctor.'],y:'Người → who/that, không dùng which.'},{w:'Hanoi, that is the capital, is very old.',r:['Hanoi, which is the capital, is very old.'],y:'Có dấu phẩy → không dùng "that", dùng "which".'}],
scramble:[{w:['the city','This','where','is','I','was born'],a:'This is the city where I was born'}],
trans:[{vi:'Tôi có một đồng nghiệp người luôn giúp đỡ mọi người.',en:['I have a colleague who always helps everyone.','I have a colleague who always helps others.']}]},
task:{type:'Miêu tả người',p:'Describe a person who has influenced you. Who are they, what are they like, and what did you learn from them?',vi:'Miêu tả một người đã ảnh hưởng đến bạn. Dùng ít nhất 4 mệnh đề quan hệ (who, which, that, where).',min:100,max:150,check:['Có ít nhất 4 mệnh đề quan hệ','Dùng đúng who cho người, which cho vật','Có 1 mệnh đề có dấu phẩy']}},

/* ================= STAGE 3 ================= */
{id:'u7',stage:2,title:'Câu chủ đề',en:'Topic sentences',min:15,
goal:'Viết câu mở đoạn nói rõ đoạn văn bàn về gì và ý chính là gì.',
theory:`<p>Người đọc tiếng Anh muốn biết ý chính <b>ngay câu đầu</b> (khác văn Việt hay "dẫn dắt"). Câu chủ đề = <b>Chủ đề</b> + <b>ý kiểm soát</b> (controlling idea).</p>
<p><i><u>Living in a big city</u> (chủ đề) <u>has three main advantages</u> (ý kiểm soát).</i></p>
<p><b>Câu chủ đề tốt:</b> không quá rộng ("Cities are interesting"), không quá hẹp ("Hanoi has 8 million people" – đó là một chi tiết). Nó là một <b>nhận định</b> mà các câu sau sẽ chứng minh.</p>`,
frames:[{f:'There are several reasons why …',ex:'There are several reasons why I enjoy cooking.'},{f:'[Topic] has both advantages and disadvantages.',ex:'Working from home has both advantages and disadvantages.'},{f:'One of the best ways to … is …',ex:'One of the best ways to reduce stress is exercise.'},{f:'[Topic] plays an important role in …',ex:'Sleep plays an important role in our health.'}],
vocab:[['main reason','lý do chính'],['benefit','lợi ích'],['important role','vai trò quan trọng'],['in my experience','theo trải nghiệm của tôi'],['for this reason','vì lý do này'],['overall','nhìn chung']],
model:{title:'Why I Enjoy Cooking',text:`{{Topic sentence::There are two main reasons why I enjoy cooking.}} {{Support 1::First, cooking helps me relax after a long day at work. When I chop vegetables and listen to music, I forget my problems.}} {{Support 2::Second, I can eat healthier food. I control the amount of oil, salt and sugar.}} {{Concluding::For these reasons, I try to cook at home at least four times a week.}}`},
mind:{c:'Why I enjoy cooking',b:[{l:'Topic sentence',k:['two main reasons']},{l:'Reason 1',k:['relax','forget problems']},{l:'Reason 2',k:['healthy','control salt/oil']},{l:'Conclusion',k:['cook 4 times/week']}]},
drills:{
order:[{q:'Sắp xếp thành đoạn văn có câu chủ đề',s:['First, walking is free and needs no special equipment.','Walking is the easiest way to stay fit.','Second, you can do it almost anywhere, even in a small neighbourhood.','For these reasons, I walk for thirty minutes every evening.'],a:[1,0,2,3]}],
pick:[{q:'Câu nào là câu chủ đề tốt nhất cho đoạn về lợi ích của đi xe đạp?',o:['Bicycles have two wheels.','Cycling to work has several important benefits.','I bought a bicycle in 2020.','Some people like cycling.'],a:1,y:'Có chủ đề (cycling to work) + ý kiểm soát (several important benefits).'},{q:'Câu nào QUÁ RỘNG để làm câu chủ đề?',o:['Technology is interesting.','Smartphones have changed how young people communicate.','Online banking saves time in two ways.'],a:0,y:'"Technology is interesting" không cho biết đoạn văn sẽ chứng minh điều gì.'}],
fix:[{w:'In this paragraph I will talk about my hometown.',r:['My hometown is famous for its friendly people and delicious food.','My hometown is a peaceful place with many beautiful beaches.'],y:'Không "thông báo" – hãy nói thẳng ý chính. (Đáp án mẫu, bạn có thể viết khác.)'}],
trans:[{vi:'Có ba lý do khiến tôi thích sống ở quê.',en:['There are three reasons why I like living in the countryside.','There are three reasons why I enjoy living in the countryside.']}]},
task:{type:'Đoạn văn',p:'Write a paragraph: "Why I enjoy [a hobby]". Start with a clear topic sentence.',vi:'Viết một đoạn văn về sở thích của bạn. Câu đầu là câu chủ đề, sau đó 2 lý do có ví dụ, câu cuối kết đoạn.',min:90,max:140,check:['Câu đầu là câu chủ đề rõ ràng','Có 2 lý do, mỗi lý do có ví dụ','Có câu kết đoạn']}},

{id:'u8',stage:2,title:'Triển khai đoạn văn theo PEEL',en:'PEEL paragraphs',min:20,
goal:'Viết đoạn văn lập luận chặt: Point – Explain – Example – Link.',
theory:`<p><b>PEEL</b> là công thức đoạn văn được dùng từ email công việc đến IELTS:</p>
<ul><li><b>P – Point:</b> nêu ý chính (câu chủ đề).</li><li><b>E – Explain:</b> giải thích vì sao / như thế nào.</li><li><b>E – Example:</b> ví dụ cụ thể, số liệu, trải nghiệm.</li><li><b>L – Link:</b> nối lại câu hỏi hoặc dẫn sang đoạn sau.</li></ul>
<p>Người mới hay chỉ viết <b>P</b> rồi nhảy sang ý khác. Đoạn văn "có thịt" là nhờ <b>E và E</b>. Mỗi ý chính nên có 3–5 câu.</p>`,
frames:[{f:'P: The main advantage of … is that …',ex:'The main advantage of city life is that there are more job opportunities.'},{f:'E: This is because … / This means that …',ex:'This is because most large companies are based in cities.'},{f:'E: For example, … / For instance, …',ex:'For example, my cousin found a well-paid job in Saigon within a month.'},{f:'L: Therefore, … / This shows that …',ex:'Therefore, young people often move to cities to build their careers.'}],
vocab:[['job opportunities','cơ hội việc làm'],['cost of living','chi phí sinh hoạt'],['facilities','cơ sở vật chất'],['pollution','ô nhiễm'],['peaceful lifestyle','lối sống yên bình'],['access to','tiếp cận']],
model:{title:'City Life',text:`{{Point::The biggest advantage of living in a city is the wide range of job opportunities.}} {{Explain::This is because most large companies and international organisations have their offices in big cities.}} {{Example::For example, my cousin moved from Nghe An to Ho Chi Minh City and found a job in a bank within a month.}} {{Link::Therefore, it is not surprising that so many young people choose to live in cities.}}`},
mind:{c:'City vs countryside',b:[{l:'City +',k:['jobs','hospitals','entertainment']},{l:'City −',k:['pollution','traffic','expensive']},{l:'Countryside +',k:['fresh air','cheap','peaceful']},{l:'Countryside −',k:['few jobs','boring']}]},
drills:{
order:[{q:'Sắp xếp thành đoạn PEEL',s:['For instance, a 30-minute walk every day can lower the risk of heart disease.','Regular exercise is one of the best ways to stay healthy.','Therefore, everyone should try to be active every day.','This is because it makes the heart and muscles stronger.'],a:[1,3,0,2]}],
fix:[{w:'For example, many people. They move to the city.',r:['For example, many people move to the city.'],y:'Câu đầu thiếu động từ — gộp lại thành một câu hoàn chỉnh.'}],
combine:[{a:'Cities have better hospitals.',b:'People can get medical care quickly.',h:'this means that',r:['Cities have better hospitals. This means that people can get medical care quickly.','Cities have better hospitals, which means that people can get medical care quickly.']}],
trans:[{vi:'Ví dụ, ở Hà Nội có rất nhiều bệnh viện lớn.',en:['For example, there are many large hospitals in Hanoi.','For example, Hanoi has many big hospitals.']}]},
task:{type:'Đoạn lập luận',p:'Is it better to live in a city or in the countryside? Write ONE paragraph using PEEL.',vi:'Sống ở thành phố hay nông thôn tốt hơn? Viết MỘT đoạn văn PEEL hoàn chỉnh.',min:100,max:150,check:['Có đủ 4 phần P–E–E–L','Ví dụ cụ thể (người thật, số liệu, trải nghiệm)','Câu cuối nối lại câu hỏi']}},

{id:'u9',stage:2,title:'Mạch lạc: từ nối & tham chiếu',en:'Coherence and cohesion',min:20,
goal:'Dùng từ nối đúng chức năng và tránh lặp từ bằng this/these/it/such.',
theory:`<p>Bài viết "rời rạc" thường do thiếu <b>cầu nối</b> giữa các câu. Học từ nối theo <b>chức năng</b>, không học thành danh sách dài:</p>
<ul><li><b>Thêm ý:</b> In addition, Moreover, Also</li><li><b>Đối lập:</b> However, On the other hand, In contrast</li><li><b>Nguyên nhân–kết quả:</b> As a result, Therefore, This leads to</li><li><b>Ví dụ:</b> For example, For instance, such as</li><li><b>Trình tự:</b> First, Then, Finally</li></ul>
<p><b>Tham chiếu:</b> thay vì lặp lại "social media", dùng <i>it, this, these platforms, such websites</i>. <b>Đừng lạm dụng</b>: nhét "Moreover" vào mọi câu khiến bài máy móc — IELTS trừ điểm việc này.</p>`,
frames:[{f:'However, …',ex:'Social media connects people. However, it can also be addictive.'},{f:'As a result, …',ex:'Many people work from home. As a result, offices are emptier.'},{f:'This + noun …',ex:'This problem affects many young people.'},{f:'such as + examples',ex:'apps such as TikTok and Instagram'}],
vocab:[['moreover','hơn nữa'],['however','tuy nhiên'],['as a result','kết quả là'],['in contrast','ngược lại'],['this trend','xu hướng này'],['such','như vậy']],
model:{title:'Learning English',text:`Learning English has many benefits. {{Adding::First,}} it opens doors to better jobs, {{Example::such as}} positions in international companies. {{Adding::In addition,}} English helps us access information, {{Reference::because most online content is written in this language.}} {{Contrast::However,}} learning a language takes time and effort. {{Result::As a result,}} many learners give up too early. {{Reference::This problem}} can be solved with a clear daily plan.`},
mind:{c:'Benefits of learning English',b:[{l:'Career',k:['better jobs','promotion']},{l:'Information',k:['online content','books']},{l:'Travel',k:['communicate','make friends']},{l:'Challenge',k:['takes time','give up']}]},
drills:{
order:[{q:'Sắp xếp theo từ nối',s:['However, it is also very expensive.','Living in the city centre is convenient.','As a result, many families move to the suburbs.','In addition, there are many shops and restaurants nearby.'],a:[1,3,0,2]}],
pick:[{q:'I studied hard. ___, I failed the exam.',o:['Moreover','However','For example','As a result'],a:1,y:'Đối lập → However.'},{q:'The roads were flooded. ___, many schools closed.',o:['As a result','In contrast','For instance'],a:0,y:'Nguyên nhân → kết quả: As a result.'},{q:'Many fruits, ___ mangoes and durians, grow in the south.',o:['such as','however','therefore'],a:0,y:'Liệt kê ví dụ trong câu → such as.'},{q:'Cycling is cheap. ___, it is good for your health.',o:['In addition','However','Instead'],a:0,y:'Thêm ý cùng chiều → In addition.'}],
fix:[{w:'Moreover, I like it. Moreover, it is cheap. Moreover, it is fast.',r:['I like it because it is cheap and fast.','I like it. It is cheap, and it is also fast.'],y:'Lạm dụng từ nối. Hãy gộp câu tự nhiên hơn.'}],
trans:[{vi:'Tuy nhiên, điều này cũng có một số nhược điểm.',en:['However, this also has some disadvantages.','However, this also has some drawbacks.']}]},
task:{type:'Đoạn văn',p:'What are the benefits of learning English? Write a paragraph with at least 5 linking words from different groups.',vi:'Lợi ích của việc học tiếng Anh. Dùng ít nhất 5 từ nối thuộc các nhóm khác nhau và 2 lần tham chiếu (this/these/it).',min:110,max:160,check:['Có 5 từ nối khác nhóm','Có this/these/such để tránh lặp','Không lạm dụng một từ nối']}},

/* ================= STAGE 4 ================= */
{id:'u10',stage:3,title:'Tin nhắn & email thân mật',en:'Informal emails',min:15,
goal:'Viết email cho bạn bè tự nhiên, thân thiện, đủ ý.',
theory:`<p>Email thân mật có <b>5 phần</b>: Lời chào → Câu mở thân thiện → Mục đích → Chi tiết → Lời kết.</p>
<p>Văn phong: dùng dạng rút gọn (<i>I'm, can't</i>), câu ngắn, câu hỏi, từ cảm thán. Tránh từ quá trang trọng như "I am writing to inform you".</p>`,
frames:[{f:'Hi / Hey + name,',ex:'Hi Lan,'},{f:'How are you? / Hope you\'re well!',ex:'Hope you\'re doing well!'},{f:'I\'m writing to… / Guess what?',ex:'Guess what? I\'ve booked a trip to Sapa!'},{f:'Do you want to…? / How about…?',ex:'How about coming with me?'},{f:'Can\'t wait to… / Talk soon, + name',ex:'Can\'t wait to see you! Talk soon, Minh'}],
vocab:[['catch up','hàn huyên'],['it\'s been ages','lâu lắm rồi'],['by the way','nhân tiện'],['let me know','báo mình nhé'],['fancy (doing)','thích (làm gì) không'],['take care','giữ gìn sức khỏe']],
model:{title:'Invitation to Sapa',text:`{{Greeting::Hi Lan,}}
{{Friendly opening::It's been ages! How are you and your new job?}}
{{Purpose::I'm writing because I'm planning a trip to Sapa next month and I'd love you to come.}}
{{Details::We can take the night bus on Friday and come back on Sunday. I've found a cosy homestay with a great view of the rice fields, and it's only 300,000 dong a night.}}
{{Closing::Let me know by Wednesday if you can join. Can't wait to catch up!
Talk soon,
Minh}}`},
mind:{c:'Email to a friend',b:[{l:'Opening',k:['it\'s been ages','how are you']},{l:'Purpose',k:['invite','trip']},{l:'Details',k:['when','where','cost']},{l:'Closing',k:['let me know','talk soon']}]},
drills:{
pick:[{q:'Câu nào phù hợp email cho BẠN THÂN?',o:['I am writing to formally request your presence.','Fancy coming to my birthday party on Saturday?','Please be informed that the party will be held.'],a:1,y:'Thân mật: câu hỏi ngắn, "Fancy + V-ing".'},{q:'Kết email thân mật:',o:['Yours faithfully,','Talk soon,','Respectfully submitted,'],a:1,y:'"Yours faithfully" dùng cho thư trang trọng.'}],
fix:[{w:'Hi Nam, I write to you to tell about my trip.',r:["Hi Nam, I'm writing to tell you about my trip.",'Hi Nam, I am writing to tell you about my trip.'],y:'"I\'m writing to tell you about…" – thì tiếp diễn và "tell you about".'}],
trans:[{vi:'Lâu rồi không gặp! Dạo này bạn thế nào?',en:["It's been ages! How are you?","Long time no see! How have you been?","It's been a long time! How are you doing?"]}]},
task:{type:'Email thân mật',p:'Write an email to a friend inviting them on a weekend trip. Say where, when, what you will do, and ask them to reply.',vi:'Viết email mời một người bạn đi chơi cuối tuần: đi đâu, khi nào, làm gì, nhờ bạn trả lời.',min:100,max:150,check:['Đủ 5 phần của email','Giọng thân mật (rút gọn, câu hỏi)','Có chi tiết: thời gian, địa điểm, hoạt động']}},

{id:'u11',stage:3,title:'Email trang trọng',en:'Formal emails',min:20,
goal:'Viết email công việc lịch sự: xin phép, đề nghị, phàn nàn.',
theory:`<p>Email trang trọng: <b>Dear + Mr/Ms + họ</b> (hoặc Dear Sir or Madam) → <b>Lý do viết</b> → <b>Chi tiết</b> → <b>Đề nghị hành động</b> → <b>Lời kết</b>.</p>
<p>Không viết tắt (I am, do not). Dùng động từ khuyết thiếu để lịch sự: <i>Could you…? I would be grateful if… I would like to…</i></p>
<p><b>Kết thư:</b> Dear Sir/Madam → <i>Yours faithfully</i>; Dear Mr Smith → <i>Yours sincerely</i>; email công việc thường ngày → <i>Best regards / Kind regards</i>.</p>`,
frames:[{f:'I am writing to request / complain about / inquire about …',ex:'I am writing to request two days of annual leave.'},{f:'I would be grateful if you could …',ex:'I would be grateful if you could approve my request.'},{f:'Unfortunately, …',ex:'Unfortunately, the room was not cleaned during my stay.'},{f:'I look forward to hearing from you.',ex:'I look forward to hearing from you soon.'}],
vocab:[['annual leave','nghỉ phép năm'],['request','yêu cầu / đề nghị'],['inconvenience','sự bất tiện'],['refund','hoàn tiền'],['attached','đính kèm'],['at your earliest convenience','sớm nhất có thể']],
model:{title:'Leave Request',text:`{{Greeting::Dear Ms Huong,}}
{{Reason::I am writing to request two days of annual leave on 12 and 13 December.}}
{{Details::My sister is getting married in Hue, and I need to travel there to help my family prepare. I have already finished the monthly report, and Mr Tuan has agreed to cover my tasks while I am away.}}
{{Request::I would be grateful if you could approve this request.}}
{{Closing::I look forward to hearing from you.
Kind regards,
Nguyen Van An}}`},
mind:{c:'Formal email',b:[{l:'Reason',k:['request leave','complain']},{l:'Details',k:['dates','reason','arrangements']},{l:'Action',k:['approve','refund','reply']},{l:'Tone',k:['no contractions','could / would']}]},
drills:{
pick:[{q:'Câu nào lịch sự nhất khi nhờ sếp?',o:['Give me Friday off.','I want Friday off.','Could I possibly take Friday off?'],a:2,y:'"Could I possibly…" rất lịch sự.'},{q:'Bắt đầu bằng "Dear Sir or Madam," → kết bằng:',o:['Yours faithfully,','Cheers,','Love,'],a:0,y:'Không biết tên người nhận → Yours faithfully.'}],
fix:[{w:"I'm writing to complain the noise.",r:['I am writing to complain about the noise.'],y:'Trang trọng: không viết tắt; "complain about".'},{w:'Please reply me soon.',r:['Please reply to me soon.','I look forward to hearing from you.'],y:'"reply to someone".'}],
trans:[{vi:'Tôi rất biết ơn nếu anh/chị có thể gửi cho tôi thêm thông tin.',en:['I would be grateful if you could send me more information.']}]},
task:{type:'Email trang trọng',p:'Write an email to a hotel manager. Complain about a problem during your stay and say what you want them to do.',vi:'Viết email phàn nàn gửi quản lý khách sạn: vấn đề gì, ảnh hưởng ra sao, bạn muốn họ làm gì.',min:120,max:170,check:['Không viết tắt, giọng lịch sự','Có lý do viết ở câu đầu','Có đề nghị hành động cụ thể']}},

{id:'u12',stage:3,title:'Kể chuyện & miêu tả',en:'Narratives and description',min:20,
goal:'Kể một câu chuyện có mở đầu, cao trào, kết thúc; dùng chi tiết giác quan.',
theory:`<p>Một câu chuyện ngắn có 4 bước: <b>Bối cảnh</b> (ai, ở đâu, khi nào) → <b>Vấn đề</b> → <b>Cao trào</b> → <b>Kết thúc & cảm nhận</b>.</p>
<p>Dùng <b>quá khứ đơn</b> cho chuỗi sự kiện, <b>quá khứ tiếp diễn</b> cho bối cảnh đang diễn ra: <i>We <u>were walking</u> along the beach when it suddenly <u>started</u> to rain.</i></p>
<p><b>Show, don't tell:</b> thay vì "I was scared", viết <i>My hands were shaking.</i> Thêm âm thanh, mùi, màu sắc để người đọc "thấy" cảnh.</p>`,
frames:[{f:'It was a … day in …',ex:'It was a hot summer day in 2019.'},{f:'S + was/were V-ing when S + V2',ex:'I was driving home when my phone rang.'},{f:'Suddenly, / All of a sudden, …',ex:'Suddenly, the lights went out.'},{f:'In the end, … / Looking back, …',ex:'Looking back, it was the best trip of my life.'}],
vocab:[['unforgettable','khó quên'],['get lost','bị lạc'],['breathtaking','ngoạn mục'],['exhausted','kiệt sức'],['relieved','nhẹ nhõm'],['all of a sudden','bất thình lình']],
model:{title:'Lost in Ha Giang',text:`{{Setting::It was a cold morning in Ha Giang, and the mountains were covered in thick fog.}} {{Problem::My friend and I were riding along a narrow road when our motorbike suddenly stopped. We had no phone signal.}} {{Climax::For an hour, we pushed the bike up the hill. My legs were shaking and I could only hear the wind.}} {{Ending::Finally, a local farmer appeared and helped us fix the engine. Looking back, that was the moment I learned how kind strangers can be.}}`},
mind:{c:'A memorable trip',b:[{l:'Setting',k:['where','when','weather']},{l:'Problem',k:['bike broke','no signal']},{l:'Climax',k:['push uphill','scared']},{l:'Ending',k:['farmer helped','lesson']},{l:'Senses',k:['fog','wind','cold']}]},
drills:{
order:[{q:'Sắp xếp câu chuyện',s:['Suddenly, a big wave knocked me off my board.','It was a sunny morning in Nha Trang.','In the end, I laughed and tried again.','I was learning to surf for the first time.'],a:[1,3,0,2]}],
combine:[{a:'I was cooking dinner.',b:'The doorbell rang.',h:'when',r:['I was cooking dinner when the doorbell rang.','When the doorbell rang, I was cooking dinner.']}],
fix:[{w:'When I arrived, they are eating dinner.',r:['When I arrived, they were eating dinner.'],y:'Bối cảnh quá khứ → were eating.'},{w:'I was very scared.',r:['My heart was beating fast.','My hands were shaking.'],y:'"Show, don\'t tell": tả biểu hiện thay vì nói tên cảm xúc. (Đáp án mẫu.)'}],
scramble:[{w:['were','We','walking','when','started','it','to rain'],a:'We were walking when it started to rain'}],
trans:[{vi:'Lúc tôi đang ngủ thì điện thoại reo.',en:['I was sleeping when the phone rang.','While I was sleeping, the phone rang.']}]},
task:{type:'Kể chuyện',p:'Write a story about a memorable trip or an unexpected event in your life.',vi:'Kể về một chuyến đi hoặc sự kiện bất ngờ đáng nhớ. Có đủ 4 bước và ít nhất 2 chi tiết giác quan.',min:130,max:180,check:['Có bối cảnh – vấn đề – cao trào – kết thúc','Dùng quá khứ đơn + quá khứ tiếp diễn','Có chi tiết giác quan / show don\'t tell']}},

/* ================= STAGE 5 ================= */
{id:'u13',stage:4,title:'Bố cục 4 đoạn & paraphrase',en:'Essay structure and paraphrasing',min:25,
goal:'Dựng khung bài luận và viết lại đề bài bằng lời của mình.',
theory:`<p>Bài luận chuẩn có <b>4 đoạn</b>:</p>
<ol><li><b>Mở bài (2 câu):</b> paraphrase đề + câu luận điểm (thesis).</li><li><b>Thân bài 1:</b> ý chính 1 theo PEEL.</li><li><b>Thân bài 2:</b> ý chính 2 theo PEEL.</li><li><b>Kết bài (1–2 câu):</b> tóm tắt, nhắc lại quan điểm. Không thêm ý mới.</li></ol>
<p><b>3 cách paraphrase:</b> (1) đổi từ đồng nghĩa: <i>important → essential</i>; (2) đổi loại từ: <i>develop → development</i>; (3) đổi cấu trúc: chủ động ↔ bị động, <i>because ↔ because of</i>.</p>
<p>Đề: <i>Many people believe that children should learn a foreign language at primary school.</i><br>→ <i>It is often argued that young pupils ought to start studying a second language in their early school years.</i></p>`,
frames:[{f:'It is often argued that …',ex:'It is often argued that technology makes life easier.'},{f:'This essay will discuss … / I believe that …',ex:'I believe that the benefits outweigh the drawbacks.'},{f:'Firstly, … / Secondly, …',ex:'Firstly, online learning is flexible.'},{f:'In conclusion, …',ex:'In conclusion, I am convinced that…'}],
vocab:[['essential','thiết yếu'],['children → young people / the younger generation','trẻ em → người trẻ'],['benefit → advantage','lợi ích'],['problem → issue / challenge','vấn đề'],['outweigh','lớn hơn, vượt trội'],['in conclusion','tóm lại']],
model:{title:'Introduction model',text:`{{Paraphrase::In many countries, young people are spending more and more time on their smartphones.}} {{Thesis::Although these devices bring some benefits, I believe their negative effects on health and study are more significant.}}

{{Conclusion::In conclusion, while smartphones can be useful tools, too much screen time harms young people's health and education, so parents should set clear limits.}}`},
mind:{c:'Essay skeleton',b:[{l:'Intro',k:['paraphrase','thesis']},{l:'Body 1',k:['Point','Explain','Example']},{l:'Body 2',k:['Point','Explain','Example']},{l:'Conclusion',k:['summary','opinion']}]},
drills:{
pick:[{q:'Paraphrase tốt nhất của "Air pollution is a big problem in cities."',o:['Air pollution is a big problem in cities.','Poor air quality has become a serious issue in urban areas.','Pollution air is big problem.'],a:1,y:'Đổi từ: pollution → poor air quality; big problem → serious issue; cities → urban areas.'},{q:'Câu nào KHÔNG nên có trong kết bài?',o:['In conclusion, the advantages outweigh the disadvantages.','Another reason is that it saves money.','Overall, I strongly support this idea.'],a:1,y:'Kết bài không đưa thêm lý do mới.'}],
fix:[{w:'In my essay I will write about the topic of smartphones.',r:['This essay will discuss the effects of smartphones on young people.','Smartphones have both positive and negative effects on young people.'],y:'Mở bài nói rõ nội dung, tránh câu "thông báo" chung chung.'}],
trans:[{vi:'Ngày càng nhiều người làm việc tại nhà.',en:['More and more people are working from home.','An increasing number of people work from home.']}]},
task:{type:'Mở bài + Kết bài',p:'Topic: "More and more people work from home." Write an introduction and a conclusion for this essay. Then write a 1-line plan for each body paragraph.',vi:'Đề: "Ngày càng nhiều người làm việc tại nhà". Viết mở bài (paraphrase + thesis), kết bài, và dàn ý 1 dòng cho mỗi thân bài.',min:80,max:140,check:['Mở bài có paraphrase, không chép đề','Có câu thesis nêu quan điểm','Kết bài không thêm ý mới']}},

{id:'u14',stage:4,title:'Opinion essay',en:'Agree or disagree',min:30,
goal:'Viết bài luận nêu quan điểm rõ ràng, có 2 lý do được chứng minh.',
theory:`<p>Dạng đề: <i>To what extent do you agree or disagree?</i></p>
<p><b>Chiến lược đơn giản nhất cho người mới:</b> chọn <b>một phía</b> (đồng ý hoặc không) và giữ nguyên quan điểm từ mở bài đến kết bài. Mỗi thân bài là một lý do theo PEEL.</p>
<p>Ngôn ngữ nêu ý kiến: <i>I strongly believe that… / In my view,… / I partly agree…</i>. Tránh "I think" lặp lại nhiều lần.</p>`,
frames:[{f:'I completely agree / disagree that …',ex:'I completely agree that schools should teach cooking.'},{f:'The main reason for my view is that …',ex:'The main reason for my view is that cooking is a life skill.'},{f:'Another reason is that …',ex:'Another reason is that it encourages healthy eating.'},{f:'Some people may argue that …; however, …',ex:'Some people may argue that it wastes class time; however, …'}],
vocab:[['strongly believe','tin chắc'],['life skill','kỹ năng sống'],['convincing','thuyết phục'],['beneficial','có lợi'],['drawback','nhược điểm'],['from my perspective','theo góc nhìn của tôi']],
model:{title:'Opinion essay (body 1)',text:`{{Point::The main reason I support this idea is that cooking is an essential life skill.}} {{Explain::Many young adults leave home without knowing how to prepare a simple meal, so they depend on fast food.}} {{Example::For example, a survey at my university showed that most first-year students ate instant noodles several times a week.}} {{Link::If schools taught basic cooking, students would be more independent and healthier.}}`},
mind:{c:'Schools should teach cooking',b:[{l:'Opinion',k:['agree']},{l:'Reason 1',k:['life skill','independent']},{l:'Reason 2',k:['healthy eating','less fast food']},{l:'Counter-argument',k:['time','cost']},{l:'Conclusion',k:['agree','add to curriculum']}]},
drills:{
order:[{q:'Sắp xếp đoạn thân bài (PEEL)',s:['For example, Finland gives students less homework but achieves excellent results.','I believe that schools should reduce homework.','Therefore, less homework can actually lead to better learning.','This is because students need time to rest and develop other skills.'],a:[1,3,0,2]}],
pick:[{q:'Câu thesis nào rõ quan điểm nhất?',o:['There are many opinions about this topic.','I strongly believe that public transport should be free.','Public transport is a topic.'],a:1,y:'Thesis tốt nêu thẳng quan điểm.'}],
combine:[{a:'Some people say homework is stressful.',b:'It helps students review lessons.',h:'however',r:['Some people say homework is stressful; however, it helps students review lessons.','Some people say homework is stressful. However, it helps students review lessons.']}],
fix:[{w:'I think that I agree because I think it is good.',r:['I agree with this idea because it brings clear benefits.','I strongly agree because this policy brings clear benefits.'],y:'Lặp "I think", lý do mơ hồ ("good").'}],
trans:[{vi:'Lý do chính cho quan điểm của tôi là nó giúp tiết kiệm thời gian.',en:['The main reason for my view is that it saves time.','The main reason for my opinion is that it helps save time.']}]},
task:{type:'Opinion essay',p:'Some people think that all university students should study whatever they like. Others believe they should only study subjects that are useful for the future. To what extent do you agree that students should study whatever they like?',vi:'Sinh viên đại học nên được học bất cứ ngành gì họ thích? Bạn đồng ý đến mức nào? Viết bài 4 đoạn.',min:200,max:280,check:['Quan điểm rõ ở mở bài và kết bài','2 thân bài, mỗi đoạn PEEL','Có ví dụ cụ thể']}},

{id:'u15',stage:4,title:'Discussion, Problem–Solution, Adv–Disadv',en:'Other essay types',min:30,
goal:'Nhận diện dạng đề và chọn đúng bố cục cho từng dạng.',
theory:`<p><b>Discuss both views (and give your opinion):</b> Thân 1 = quan điểm A, Thân 2 = quan điểm B, nêu ý kiến của bạn ở mở bài và kết bài.</p>
<p><b>Problem – Solution / Causes – Effects:</b> Thân 1 = nguyên nhân/vấn đề, Thân 2 = giải pháp/hậu quả. Mỗi vấn đề nên có giải pháp tương ứng.</p>
<p><b>Advantages – Disadvantages:</b> Thân 1 = ưu điểm, Thân 2 = nhược điểm. Nếu đề hỏi "Do the advantages outweigh…?" thì phải nói rõ bên nào lớn hơn.</p>
<p><b>Mẹo nhận diện:</b> gạch chân câu hỏi cuối đề. Trả lời <b>đúng và đủ</b> mọi phần câu hỏi — đó là tiêu chí Task Response.</p>`,
frames:[{f:'On the one hand, … On the other hand, …',ex:'On the one hand, tourism creates jobs.'},{f:'One major cause of … is …',ex:'One major cause of traffic jams is the number of private vehicles.'},{f:'One effective solution would be to …',ex:'One effective solution would be to improve public transport.'},{f:'The advantages outweigh the disadvantages because …',ex:'The advantages outweigh the disadvantages because…'}],
vocab:[['tackle','giải quyết'],['root cause','nguyên nhân gốc'],['consequence','hậu quả'],['measure','biện pháp'],['the government should','chính phủ nên'],['raise awareness','nâng cao nhận thức']],
model:{title:'Problem–Solution (body 2)',text:`{{Solution::The most effective solution to traffic congestion would be to invest in public transport.}} {{Explain::If buses and metro lines were fast, cheap and reliable, fewer people would need to ride motorbikes.}} {{Example::For instance, since the first metro line opened in Ho Chi Minh City, thousands of commuters use it every day instead of driving.}} {{Link::Therefore, governments should treat public transport as a top priority.}}`},
mind:{c:'Traffic jams in big cities',b:[{l:'Causes',k:['too many motorbikes','narrow roads','poor planning']},{l:'Effects',k:['lost time','pollution','stress']},{l:'Solutions',k:['metro & buses','work from home','limit cars']}]},
drills:{
pick:[{q:'"Why is obesity increasing? What can be done?" là dạng:',o:['Opinion','Causes – Solutions','Advantages – Disadvantages'],a:1,y:'Hỏi nguyên nhân (why) và giải pháp (what can be done).'},{q:'"Discuss both views and give your own opinion" – ý kiến của bạn nên ở:',o:['Chỉ ở kết bài','Mở bài và kết bài','Không cần nêu'],a:1,y:'Nêu rõ ở mở bài và nhắc lại ở kết bài.'},{q:'"Do the advantages outweigh the disadvantages?" – bạn phải:',o:['Chỉ liệt kê ưu và nhược','Nói rõ bên nào lớn hơn','Chỉ viết ưu điểm'],a:1,y:'Câu hỏi "outweigh" đòi hỏi kết luận bên nào lớn hơn.'}],
combine:[{a:'Many people drive to work.',b:'Roads become crowded.',h:'as a result',r:['Many people drive to work. As a result, roads become crowded.','Many people drive to work; as a result, roads become crowded.']}],
trans:[{vi:'Một giải pháp hiệu quả là chính phủ nên đầu tư vào giao thông công cộng.',en:['One effective solution is that the government should invest in public transport.','One effective solution would be for the government to invest in public transport.']}]},
task:{type:'Problem–Solution essay',p:'In many cities, young people find it difficult to buy a home. What are the causes of this problem, and what solutions can you suggest?',vi:'Ở nhiều thành phố, người trẻ khó mua được nhà. Nguyên nhân là gì và có giải pháp nào?',min:220,max:290,check:['Trả lời đủ 2 câu hỏi (causes + solutions)','Giải pháp khớp với nguyên nhân','Từ nối nguyên nhân–kết quả']}},

/* ================= STAGE 6 ================= */
{id:'u16',stage:5,title:'IELTS Task 2 hoàn chỉnh',en:'IELTS Writing Task 2',min:45,
goal:'Viết bài 250+ từ trong 40 phút, đáp ứng 4 tiêu chí chấm.',
theory:`<p>IELTS chấm Writing theo <b>4 tiêu chí, mỗi tiêu chí 25%</b>:</p>
<ul><li><b>Task Response (TR):</b> trả lời đủ mọi phần câu hỏi, quan điểm rõ, ý được phát triển.</li><li><b>Coherence & Cohesion (CC):</b> bố cục logic, chia đoạn, từ nối tự nhiên.</li><li><b>Lexical Resource (LR):</b> từ vựng đa dạng, chính xác, collocation đúng.</li><li><b>Grammatical Range & Accuracy (GRA):</b> đa dạng cấu trúc (câu phức, mệnh đề quan hệ, điều kiện…) và ít lỗi.</li></ul>
<p><b>Phân bổ 40 phút:</b> 5' đọc đề + mind map → 30' viết → 5' soát lỗi (thì, số ít/nhiều, mạo từ, -s).</p>
<p><b>Band 6 → 7 khác nhau ở đâu?</b> Band 7: ý được <i>mở rộng và chứng minh</i>, nhiều câu không lỗi, dùng được một số từ ít phổ biến. Band 6 thường đủ ý nhưng giải thích chung chung và lỗi lặp lại.</p>`,
frames:[{f:'It is widely believed that … However, …',ex:'It is widely believed that…'},{f:'There is no doubt that …',ex:'There is no doubt that technology has transformed education.'},{f:'A case in point is …',ex:'A case in point is Singapore, where…'},{f:'If …, … would …',ex:'If governments taxed sugary drinks, people would consume less sugar.'}],
vocab:[['have a detrimental effect on','có hại cho'],['play a pivotal role','đóng vai trò then chốt'],['a growing number of','ngày càng nhiều'],['be exposed to','tiếp xúc với'],['in the long run','về lâu dài'],['there is a tendency for','có xu hướng']],
model:{title:'Band 7 body paragraph',text:`{{Point::One of the main reasons why online learning has become popular is its flexibility.}} {{Explain::Learners can access lectures at any time and study at their own pace, which is particularly valuable for people who work full-time.}} {{Example::A case in point is my colleague, who completed a master's degree online while keeping her job at a bank.}} {{Link::Without such flexible options, many adults would have no chance to continue their education.}}`},
mind:{c:'IELTS Task 2 plan',b:[{l:'Question type',k:['opinion','discuss','problem']},{l:'Position',k:['thesis']},{l:'Body 1',k:['idea','why','example']},{l:'Body 2',k:['idea','why','example']},{l:'Check',k:['tenses','articles','plurals']}]},
drills:{
pick:[{q:'Tiêu chí nào đánh giá việc trả lời đủ các phần câu hỏi?',o:['Lexical Resource','Task Response','Grammatical Range'],a:1,y:'Task Response.'},{q:'Task 2 có trọng số so với Task 1 như thế nào?',o:['Bằng nhau','Gấp đôi','Một nửa'],a:1,y:'Task 2 tính điểm gấp đôi Task 1.'},{q:'Collocation đúng:',o:['make a research','do research','take research'],a:1,y:'"do research" / "carry out research".'}],
fix:[{w:'Nowadays, people is using internet more than before.',r:['Nowadays, people are using the internet more than before.','Nowadays, people use the internet more than before.'],y:'"people" số nhiều → are; "the internet".'},{w:'This can make a big impact to the society.',r:['This can have a big impact on society.','This can have a significant impact on society.'],y:'"have an impact on"; "society" nói chung không dùng "the".'}],
trans:[{vi:'Về lâu dài, điều này sẽ có hại cho sức khỏe của trẻ em.',en:["In the long run, this will have a detrimental effect on children's health.","In the long run, this will be harmful to children's health."]}]},
task:{type:'IELTS Task 2',p:'Some people believe that the best way to improve public health is by increasing the number of sports facilities. Others, however, think that this would have little effect and that other measures are needed. Discuss both views and give your own opinion.',vi:'Có người cho rằng tăng số cơ sở thể thao là cách tốt nhất cải thiện sức khỏe cộng đồng; người khác cho rằng cần biện pháp khác. Bàn cả hai quan điểm và nêu ý kiến của bạn.',min:250,max:320,timer:40,ielts:true,check:['Bàn cả 2 quan điểm + nêu ý kiến','4 đoạn rõ ràng','Đa dạng cấu trúc câu','Tối thiểu 250 từ']}},

{id:'u17',stage:5,title:'IELTS Task 1: mô tả số liệu',en:'IELTS Task 1 Academic',min:30,
goal:'Viết overview và so sánh số liệu chính trong 150+ từ.',
theory:`<p>Bố cục Task 1 Academic: <b>Mở bài</b> (paraphrase đề) → <b>Overview</b> (2 xu hướng/đặc điểm nổi bật nhất, KHÔNG có số liệu) → <b>Thân 1, Thân 2</b> (nhóm số liệu, so sánh).</p>
<p><b>Overview là phần quan trọng nhất</b> — thiếu overview thì Task Achievement khó vượt band 5.</p>
<p>Ngôn ngữ xu hướng: <i>rise / increase / grow</i>; <i>fall / decline / drop</i>; <i>fluctuate</i>; <i>remain stable</i>; <i>peak at</i>; mức độ: <i>sharply, significantly, slightly, gradually</i>. So sánh: <i>twice as … as, the highest, compared with</i>.</p>
<p>Đề trong app được đưa dưới dạng bảng số để bạn tập mà không cần hình.</p>`,
frames:[{f:'The table/chart illustrates …',ex:'The chart illustrates the percentage of households with internet access.'},{f:'Overall, it is clear that …',ex:'Overall, it is clear that car use rose, while bus use fell.'},{f:'X rose sharply from … to …',ex:'Sales rose sharply from 20% to 45%.'},{f:'By contrast, …',ex:'By contrast, the figure for trains remained stable.'}],
vocab:[['illustrate','minh họa'],['proportion','tỉ lệ'],['reach a peak','đạt đỉnh'],['fluctuate','dao động'],['remain stable','giữ ổn định'],['a quarter / a third','một phần tư / một phần ba']],
model:{title:'Overview model',text:`{{Introduction::The table compares how people in one city travelled to work in 2000, 2010 and 2020.}} {{Overview::Overall, motorbikes were the most common way to commute throughout the period, while the use of public transport grew steadily.}} {{Detail::In 2000, 65% of commuters rode motorbikes, compared with only 5% who took the bus.}}`},

theory:`<p>Task 1 General Training: viết thư theo tình huống với <b>3 gạch đầu dòng</b>. Mỗi gạch đầu dòng = một đoạn.</p>

<p>Lỗi hay gặp: bỏ sót một gạch đầu dòng, văn phong lẫn lộn, không nói rõ mục đích ở câu đầu.</p>`,

<script>

/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#2b45d4','#d9342b','#0f8a5f','#c77700','#7c3aed','#0e7490'];
const view=$('#view');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const todayStr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const words=t=>(t.trim().match(/[A-Za-zÀ-ỹ0-9'’-]+/g)||[]).length;
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
const CONTR={"don't":"do not","doesn't":"does not","didn't":"did not","can't":"cannot","won't":"will not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","i'm":"i am","it's":"it is","you're":"you are","we're":"we are","they're":"they are","i've":"i have","i'd":"i would","i'll":"i will","let's":"let us","that's":"that is","there's":"there is","he's":"he is","she's":"she is"};
const norm=s=>{let t=String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();t=t.replace(/[a-z]+'[a-z]+/g,w=>CONTR[w]||w);return t.replace(/can not/g,'cannot').replace(/[.,!?;:"()]/g,'').replace(/\s+/g,' ').trim()};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2800)}
function openModal(html){$('#modalBody').innerHTML=html+'<div class="row sp"><button class="btn" id="mClose">Đóng</button></div>';$('#modal').classList.add('on');$('#mClose').onclick=closeModal}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const UNIT=id=>UNITS.find(u=>u.id===id);
function promptHTML(p){let o='',tb=[];const flush=()=>{if(tb.length){o+='<div class="scroll"><table class="ptab">'+tb.map((r,i)=>'<tr>'+r.map(c=>i?`<td>${esc(c)}</td>`:`<th>${esc(c)}</th>`).join('')+'</tr>').join('')+'</table></div>';tb=[]}};
  for(const l of String(p).split('\n')){if(/^\s*\|/.test(l))tb.push(l.split('|').slice(1,-1).map(x=>x.trim()));else{flush();o+=esc(l)+'\n'}}flush();return o.trim()}

const use=n=>(window.claude&&typeof window.claude.use==='function')?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
async function initCloud(){
  try{const [user,db]=await Promise.all([use('user'),use('db')]);if(!user||!db)return;const uid=await user.id();if(!uid)return;CL={db,uid};
    const snap=await Promise.race([db.doc('data/users/'+uid+'/progress').get(),new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),10000))]);
    syncMode='cloud';
    if(snap.exists){const d=snap.data();if((d.updated||0)>(S.updated||0)){S=Object.assign(fresh(),JSON.parse(JSON.stringify(d)));migrate();saveLocal();route()}else if((S.updated||0)>(d.updated||0))push()}
    else if(S.updated)push();
    header();
  }catch(e){CL=null;syncMode='local'}
}
